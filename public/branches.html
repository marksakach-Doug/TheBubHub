<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Click Growth</title>
<style>
/* The brief is all white with black ink, so these stay fixed in light and dark viewers. */
:root{--paper:#fff;--ink:#000;--hint:#c4c4c4;--line:#e4e4e4;--soft:#777;color-scheme:light}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
svg{position:fixed;inset:0;width:100%;height:100%;display:block}
svg path{fill:var(--ink)}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;font:13px/1 Georgia,"Times New Roman",serif;letter-spacing:.3em;color:var(--hint);transition:opacity .8s;pointer-events:none}
#ui{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);width:216px;font:12px/1.3 Georgia,"Times New Roman",serif;color:var(--soft);cursor:default;text-align:right}
#ui button,#ui select{font:inherit;color:var(--soft);background:var(--paper);border:1px solid var(--line);padding:3px 8px;cursor:pointer}
#ui button:hover,#ui button[aria-pressed=true],#ui select:hover{color:var(--ink);border-color:var(--ink)}
#panel{margin-top:6px;padding:10px 12px 8px;background:rgba(255,255,255,.94);border:1px solid var(--line);text-align:left;max-height:calc(100vh - 74px);overflow:auto}
#panel[hidden]{display:none}
#pre{width:100%;margin-bottom:6px;padding:4px 6px}
#panel h4{margin:10px 0 4px;font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
#panel label{display:grid;grid-template-columns:1fr auto;column-gap:8px}
#panel output{color:var(--ink);font-variant-numeric:tabular-nums}
#panel input{grid-column:1/-1;width:100%;margin:2px 0 8px;accent-color:#000}
#bt{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
</style>
</head>
<body>
<svg id="t" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet"></svg>
<div id="hint">click</div>
<div id="ui">
  <button id="tg" aria-expanded="true">levers</button>
  <div id="panel">
    <select id="pre" aria-label="preset"></select>
    <div id="rows"></div>
    <div id="bt"><button id="auto" aria-pressed="false">auto</button><button id="rs">restart</button><button id="df">defaults</button><button id="sv">save svg</button></div>
  </div>
</div>
<script>
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('t'),hint=document.getElementById('hint');
const W=innerWidth,H=innerHeight,PI=Math.PI,TAU=PI*2,C=4,DS=4,D=24,FC=(D/C)*(D/C),M=H*.05;
const U=Math.max(.45,Math.min(1.6,Math.min(W,H)/800));
const COLS=Math.ceil(W/C)+1,ROWS=Math.ceil(H/C)+3,grid=new Int32Array(COLS*ROWS);
const DC=Math.ceil(W/D)+1,DR=Math.ceil(H/D)+2,dens=new Uint16Array(DC*DR);
svg.setAttribute('viewBox','0 0 '+W+' '+H);

/* One engine, many looks. A look is just a set of values (a preset). Levers: key, label, min, max, step. */
const LV=[['seed'],['stem','stem from bottom',0,1,1],['rays','rays from click',0,16,1],['shells','shell rings',0,1,1],['len0','seed length',20,500,1],
['path'],['ds','step length',3,16,1],['wave','wave size',0,2.2,.01],['wl','wavelength',40,360,1],['jag','jaggedness',0,1.5,.01],['stiff','stiffness',0,.4,.01],['noise','wobble',0,.3,.005],['curl','hooked tips',0,1,.01],['snap','lattice angles (0 = off)',0,12,1],['tilt','tilt',0,.3,.005],['light','light pull',0,1,.01],['wall','wall push',0,1,.01],
['branching'],['fork','tip forks',0,1,.01],['sides','side shoots',0,2,.01],['spread','branch angle',.3,2,.01],['sidelen','side length',.2,1,.01],['persist','tip persistence',0,1.1,.01],['minlen','tip min length',10,200,1],['hair','hairlines per click',0,40,1],['revive','revived ends per click',0,40,1],
['contact'],['contact','on contact: 0 pass, 1 avoid, 2 join',0,2,1],['space','spacing',3,28,1],['steer','dodge',0,1,.01],['crowd','crowd limit',.02,.6,.01],
['shape'],['width','thickness',1,8,.1],['taper','taper',.5,1,.01],['minw','thinnest',.3,2,.05],['rough','edge roughness',0,1.2,.01],['prism','prism shape',0,1,1],['aspect','prism width',.04,.4,.01],
['shells'],['gap','shell spacing',14,80,1],['cell','lattice cell',6,40,1],['rjit','jitter',0,.8,.01],['twist','shell twist',0,1,.01],['struts','struts: 0 none, 1 one, 2 mesh',0,2,1],['open','pores',0,.8,.01],['spines','spines per shell',0,40,1],['spineL','spine length',10,220,1],['spiral','spiral',0,1,.01],['sag','sag between rays',0,1,.01],
['general'],['speed','grow time (ms)',150,2000,10],['cap','max pieces',2000,40000,500]];
const BASE={stem:0,rays:0,shells:0,len0:110,ds:4,wave:0,wl:130,jag:0,stiff:0,noise:0,curl:0,snap:0,tilt:.03,light:.22,wall:0,fork:0,sides:0,spread:1,sidelen:.55,persist:.84,minlen:22,hair:0,revive:0,contact:1,space:8,steer:0,crowd:.3,width:3,taper:.82,minw:.7,rough:0,prism:0,aspect:.1,gap:34,cell:18,rjit:.25,twist:.5,struts:2,open:.2,spines:12,spineL:90,spiral:0,sag:0,speed:800,cap:16000};
const PRESETS={
tree:{stem:1,len0:176,wave:1,noise:.08,curl:.15,wall:1,fork:.4,sides:.55,revive:8,space:15,steer:.6},
lightning:{stem:1,len0:190,ds:6,jag:1.1,stiff:.1,light:.7,wall:1,fork:.35,sides:.8,spread:.45,sidelen:.6,persist:.95,minlen:18,space:9,crowd:.35,width:2.4,taper:.85,minw:.6},
radiolarian:{shells:1,contact:0,ds:8,light:0,persist:.85,minlen:24,fork:.45},
spiderweb:{rays:14,len0:330,ds:12,contact:0,persist:0,light:0,rjit:.04,shells:1,gap:22,cell:9,twist:0,struts:0,spines:0,spiral:1,sag:.6,width:2.2,taper:.9},
crack:{rays:5,len0:110,ds:9,jag:.9,stiff:.07,light:.09,sides:.5,sidelen:.85,persist:1,minlen:20,hair:10,contact:2,space:5,width:4.5,taper:.8,rough:.5},
crystal:{rays:6,len0:99,snap:6,prism:1,aspect:.1,fork:.5,sides:.6,sidelen:.7,persist:.8,minlen:18,light:.25,revive:8,space:10},
coral:{rays:1,len0:220,wave:.6,wl:90,jag:.2,noise:.12,light:.15,wall:1,fork:.1,sides:.12,sidelen:.8,persist:1,minlen:140,revive:6,space:9,steer:1,crowd:.5,width:2.2,taper:.95,minw:.9},
veins:{rays:4,len0:90,ds:5,wave:.6,wl:70,jag:.5,stiff:.05,noise:.1,light:.3,fork:.6,sides:1.2,spread:.9,sidelen:.6,persist:.9,minlen:16,hair:14,contact:2,space:6,width:2.2,taper:.85,minw:.5,rough:.15}
};
const V={},rowsEl=document.getElementById('rows'),sel=document.getElementById('pre');
let preset='tree';
sel.innerHTML=Object.keys(PRESETS).map(n=>'<option>'+n+'</option>').join('');
function build(){
  rowsEl.innerHTML=LV.map(e=>e.length==1?'<h4>'+e[0]+'</h4>':'<label><span>'+e[1]+'</span><output id="o_'+e[0]+'">'+V[e[0]]+'</output><input type="range" data-k="'+e[0]+'" min="'+e[2]+'" max="'+e[3]+'" step="'+e[4]+'" value="'+V[e[0]]+'"></label>').join('');
  sel.value=preset;
}
function load(n){preset=n;Object.assign(V,BASE,PRESETS[n]);build()}
rowsEl.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;V[k]=+e.target.value;document.getElementById('o_'+k).textContent=e.target.value});
load('tree');

const dA=(t,a)=>Math.atan2(Math.sin(t-a),Math.cos(t-a));
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const f1=v=>Math.round(v*10)/10,SN=()=>V.snap>=3?TAU/Math.round(V.snap):0;
const cell=(x,y)=>{if(x<0||y<0)return-1;const i=x/C|0,j=y/C|0;return i>=COLS||j>=ROWS?-1:j*COLS+i};
const dn=(x,y)=>{if(x<0||y<0)return 1;const i=x/D|0,j=y/D|0;return i>=DC||j>=DR?1:dens[j*DC+i]/FC};
function blk(x,y,id,rho){
  if(x<0||y<0||x>W||y>H+6)return true;
  const i=x/C|0,j=y/C|0;
  for(let dj=-rho;dj<=rho;dj++){const jj=j+dj;if(jj<0||jj>=ROWS)continue;
    for(let di=-rho;di<=rho;di++){const ii=i+di;if(ii<0||ii>=COLS)continue;const v=grid[jj*COLS+ii];if(v&&v!==id)return true}}
  return false;
}
function mark(X,Y,id){
  for(let i=0;i<X.length-1;i++){
    const dx=X[i+1]-X[i],dy=Y[i+1]-Y[i],m=Math.max(1,Math.ceil(Math.hypot(dx,dy)/3));
    for(let q=0;q<=m;q++){const c=cell(X[i]+dx*q/m,Y[i]+dy*q/m);
      if(c>=0&&!grid[c]){grid[c]=id;dens[((c/COLS|0)*C/D|0)*DC+((c%COLS)*C/D|0)]++}}
  }
}
/* A polyline with a half-width at each vertex becomes a closed polygon. */
function mk(X,Y,Wd,dl){
  const n=X.length-1,Hd=[];
  for(let i=0;i<n;i++)Hd.push(Math.atan2(Y[i+1]-Y[i],X[i+1]-X[i]));
  const P={n,dl,cx:X,cy:Y,lx:[],ly:[],rx:[],ry:[]};
  for(let i=0;i<=n;i++){
    const h=i==0?Hd[0]:i==n?Hd[n-1]:Math.atan2(Math.sin(Hd[i-1])+Math.sin(Hd[i]),Math.cos(Hd[i-1])+Math.cos(Hd[i]));
    const hw=Wd[i]/2,nx=-Math.sin(h)*hw,ny=Math.cos(h)*hw;
    P.lx.push(X[i]+nx);P.ly.push(Y[i]+ny);P.rx.push(X[i]-nx);P.ry.push(Y[i]-ny);
  }
  return P;
}
let T=null,anim=null,raf=0,nid=0,total=0,auto=0;

/* Seed: a stem from the bottom, rays from the click, and/or a set of shell rings around it. */
function plant(px,py){
  const r=rng(Math.random()*4294967296),S=SN(),pend=[],rm=.42*Math.min(W,H);
  const cl=(v,L)=>rm*2>=L?L/2:Math.max(rm,Math.min(L-rm,v));
  const cx=V.shells?cl(px,W):px,cy=V.shells?cl(py,H):py,n=Math.round(V.rays),b0=r()*TAU;
  T={r,gen:0,pending:pend,dead:[],pool:[],hold:[],x:cx,y:cy,lx:px,ly:py,b0,shell:0,rlast:0,rmax:rm,prev:null,sdone:false};
  if(V.stem)pend.push({x:Math.max(W*.06,Math.min(W*.94,px)),y:H+3,a:-PI/2+(r()-.5)*.3,len:V.len0*U,w:V.width,d:0,wr:1});
  for(let i=0;i<n;i++)pend.push({x:cx,y:cy,a:b0+i*TAU/n+(S?0:(r()-.5)*V.rjit*2),len:V.len0*U,w:V.width,d:0,wr:1});
}

/* The walker. It follows a heading that waves, jags, or locks to a lattice; it avoids, ignores or
   joins what it meets; and it leaves forks, side shoots and hairlines to grow on later clicks. */
function walk(o,r,next){
  const id=++nid,S=SN(),rho=Math.max(1,Math.round(V.space/C)),grace=14+1.8*V.space,ds=S?DS:V.ds,maxN=Math.max(2,Math.ceil(o.len/ds));
  const A=(.35+r()*.7)*V.wave,k=TAU/(V.wl*(.6+r()*1.2)),ph=r()*TAU,ml=V.minlen*U;
  const turn=!S&&o.d>=2&&o.len>=30&&r()<V.curl?(r()<.5?1:-1)*Math.min(3,.03*o.len):0;
  const a0=S?o.a+(r()-.5)*V.tilt:o.a;
  let x=o.x,y=o.y,b=a0,wob=0,hit=false;
  const X=[x],Y=[y],Hd=[];
  for(let i=1;i<=maxN&&!hit;i++){
    const s=i*ds;let h=a0;
    if(!S){
      b+=(r()-.5)*V.jag+dA(a0,b)*V.stiff;
      if(V.wall>0){
        let ux=0,uy=0;
        if(x<M)ux=1-x/M;else if(x>W-M)ux=-(1-(W-x)/M);
        if(y<M)uy=1-y/M;else if(y>H-M)uy=-(1-(H-y)/M);
        if(ux||uy)b+=.4*V.wall*Math.min(1,Math.hypot(ux,uy))*dA(Math.atan2(uy,ux),b);
      }
      wob+=(r()-.5)*V.noise;
      h=b+wob+A*Math.sin(k*s+ph)*Math.min(1,s/24);
      if(turn&&s>o.len*.55){const q=(s-o.len*.55)/(o.len*.45);h+=turn*q*q}
      if(V.contact==1&&V.steer>0&&s>grace){
        const la=V.space+10;
        if(blk(x+Math.cos(h)*la,y+Math.sin(h)*la,id,rho)){
          const fl=!blk(x+Math.cos(h-.7)*la,y+Math.sin(h-.7)*la,id,rho),fr=!blk(x+Math.cos(h+.7)*la,y+Math.sin(h+.7)*la,id,rho);
          if(fl||fr){const d=(fl&&fr?(r()<.5?-1:1):fl?-1:1)*.3*V.steer;b+=d;h+=d}
        }
      }
    }
    const x0=x,y0=y;x+=Math.cos(h)*ds;y+=Math.sin(h)*ds;
    if(x<1||y<1||x>W-1||y>H+6){hit=true;x=Math.max(1,Math.min(W-1,x));y=Math.max(1,Math.min(H+6,y))}
    else if(V.contact&&s>grace)for(let q=1;q<=3;q++){
      const sx=x0+(x-x0)*q/3,sy=y0+(y-y0)*q/3;
      if(blk(sx,sy,id,rho)){
        if(V.contact==2){x=sx+Math.cos(h)*rho*C*.8;y=sy+Math.sin(h)*rho*C*.8}else{x=x0;y=y0}
        hit=true;break;
      }
    }
    if(x==x0&&y==y0)break;
    X.push(x);Y.push(y);Hd.push(h);
  }
  const n=X.length-1;
  if(n<1||n*ds<10)return null;
  total++;
  const w0=o.w,w1=Math.max(V.minw*.65,w0*V.taper),ex=X[n],ey=Y[n],ea=S?o.a:Hd[n-1],sp=(.3+r()*.3)*V.spread,d=r()<.5?1:-1;
  const out=o.sp&&!T.sdone?T.hold:next,dead=hit||turn;
  const sgn=(b0,px,py)=>{const g=Math.atan2(T.ly-py,T.lx-px),st=S||1;return r()<Math.min(1,V.light*2.4)?(Math.abs(dA(g,b0+st))<Math.abs(dA(g,b0-st))?1:-1):(r()<.5?1:-1)};
  const kid=(kx,ky,ka,len,w,main,wr)=>{
    if(main?total>=V.cap*2.5:(total>=V.cap||out.length>900))return;
    if(o.hair&&len<10)return;
    out.push({x:kx,y:ky,a:ka,len:o.hair?len:Math.max(ml,len),w:Math.max(V.minw,w),d:o.d+1,wr,sp:o.sp,hair:o.hair});
  };
  if(!dead&&V.persist>.05)kid(ex,ey,S?o.a:ea+d*sp*.35,o.len*(o.hair?.75:V.persist*(.88+r()*.24)),w1*.88,1,o.wr*.92);
  if(!o.hair&&!dead&&dn(ex,ey)<=V.crowd){
    if(r()<V.fork)kid(ex,ey,S?o.a+sgn(o.a,ex,ey)*S:ea-d*(sp+.25+r()*.45),o.len*(.6+r()*.18),w1*.88,0,o.wr*.85);
    if(!S&&o.d>1&&r()<V.fork*.3)kid(ex,ey,ea+d*(sp+.7),o.len*(.5+r()*.1),w1*.8,0,o.wr*.8);
  }
  if(dead){if(T.dead.length>4000)T.dead.splice(r()*4000|0,1);T.dead.push({x:ex,y:ey,a:ea,w:w1,d:o.d,wr:o.wr})}
  const ns=o.hair||n<2?0:Math.floor(V.sides*(o.d==0?2:1)+r());
  let sd=r()<.5?1:-1;
  for(let j=0;j<ns;j++,sd=-sd){
    const t=o.d>0?.2+r()*.65:.35+r()*.55,kk=Math.max(1,Math.min(n-1,Math.round(t*n)));
    if(dn(X[kk],Y[kk])>V.crowd)continue;
    kid(X[kk],Y[kk],S?o.a+sgn(o.a,X[kk],Y[kk])*S:Hd[kk-1]+sd*(.55+r()*.7)*V.spread,o.len*V.sidelen*(.82+r()*.36),(w0+(w1-w0)*kk/n)*.8,0,o.wr*.8);
  }
  if(V.hair>0)for(let i=1;i<n;i+=2){if(T.pool.length>5000)T.pool.shift();T.pool.push({x:X[i],y:Y[i],a:Hd[i-1],w:Math.max(.3,w0+(w1-w0)*i/n)})}
  mark(X,Y,id);
  if(V.prism){
    const len=Math.hypot(ex-X[0],ey-Y[0]),w=Math.max(V.minw*2,len*V.aspect*o.wr);
    return mk([X[0],X[0]+(ex-X[0])*.7,ex],[Y[0],Y[0]+(ey-Y[0])*.7,ey],[w,w,.5],r()*.4);
  }
  return mk(X,Y,X.map((_,i)=>Math.max(.3,(w0+(w1-w0)*i/n)*(i==0?1:1+(r()-.5)*V.rough))),r()*.4);
}

/* Shell rings: concentric lattices (radiolarian) or one continuous spiral thread (web). */
function shells(bs,pend,r){
  const k=T.shell++,gap=V.gap*U,cl=Math.max(4,V.cell*U),rk=14*U+k*gap,lw=Math.max(V.minw,V.width*.3);
  if(rk>T.rmax){if(!T.sdone){T.sdone=true;for(const q of T.hold)pend.push(q);T.hold=[]}return}
  const ln=(a,b,w)=>{if(total<V.cap*2.5){total++;bs.push(mk([a.x,b.x],[a.y,b.y],[w,w],r()*.5))}};
  const N=Math.max(6,Math.round(TAU*rk/cl)),sp=V.spiral>0,off=sp?T.b0:r()*TAU*V.twist,np=Math.round(V.rays),pts=[];
  for(let i=0;i<=(sp?N:N-1);i++){
    const e=sp&&(i==0||i==N),a=off+(i+(e?0:(r()-.5)*V.rjit))/N*TAU;
    let rr=(rk+(sp?V.spiral*gap*i/N:0))*(e?1:1+(r()-.5)*V.rjit*.3);
    if(V.sag>0&&np>0)rr*=1-V.sag*.15*(1-Math.cos(np*(a-T.b0)))/2;
    pts.push({a,x:T.x+Math.cos(a)*rr,y:T.y+Math.sin(a)*rr});
  }
  for(let i=0;i<pts.length-1;i++)ln(pts[i],pts[i+1],lw);
  if(!sp)ln(pts[pts.length-1],pts[0],lw);
  const pv=T.prev;
  if(V.struts>0){
    if(!pv)for(const p of pts)ln({x:T.x,y:T.y},p,lw*.8);
    else for(const p of pts){
      let j=0,bd=9;
      for(let m=0;m<pv.length;m++){const d=Math.abs(dA(pv[m].a,p.a));if(d<bd){bd=d;j=m}}
      if(r()>V.open)ln(p,pv[j],lw*.8);
      if(V.struts>=2&&r()>V.open)ln(p,pv[(j+(dA(pv[j].a,p.a)>0?1:pv.length-1))%pv.length],lw*.6);
    }
  }
  const ns=Math.min(V.spines,pts.length),st=pts.length/Math.max(1,ns),s0=r()*pts.length,last=rk+gap>T.rmax;
  for(let q=0;q<ns;q++){
    const p=pts[((s0+q*st)|0)%pts.length];
    pend.push({x:p.x,y:p.y,a:p.a,len:V.spineL*U*(.6+.8*r())*(last?1.8:1),w:lw*1.4,d:0,wr:1,sp:1});
  }
  T.prev=pts;T.rlast=rk;
}

/* One click: revive blocked ends, sprout hairlines, add a shell, then run every pending walker. */
function grow(px,py){
  const r=T.r,next=[],bs=[],pend=T.pending.slice(),S=SN(),Dd=T.dead,pl=T.pool,ml=V.minlen*U;
  T.gen++;T.lx=px;T.ly=py;
  for(let t=0;t<V.revive&&Dd.length;t++){
    let best=-1,bf=9;
    for(let q=0;q<14;q++){const j=r()*Dd.length|0,f=dn(Dd[j].x,Dd[j].y);if(f<bf){bf=f;best=j}}
    if(bf>V.crowd*1.6)continue;
    const e=Dd[best];Dd[best]=Dd[Dd.length-1];Dd.pop();
    pend.push({x:e.x,y:e.y,a:e.a+(r()<.5?-1:1)*(S?S*(1+(r()<.3?1:0)):.5+r()*.9),len:Math.max(ml,40*U),w:Math.max(V.minw,e.w),d:e.d+1,wr:e.wr});
  }
  for(let t=0;t<V.hair&&pl.length;t++){
    const j=r()*pl.length|0,e=pl[j];pl[j]=pl[pl.length-1];pl.pop();
    pend.push({x:e.x,y:e.y,a:e.a+(r()<.5?-1:1)*(1.1+r()*.6),len:(25+r()*55)*U,w:Math.max(V.minw,e.w*.5),d:3,wr:1,hair:1});
  }
  if(V.shells)shells(bs,pend,r);
  for(let i=pend.length-1;i>0;i--){const j=r()*(i+1)|0;const t=pend[i];pend[i]=pend[j];pend[j]=t}
  for(const o of pend){
    if(o.sp&&Math.hypot(o.x-T.x,o.y-T.y)<T.rlast-20*U)continue;
    if(o.d>0&&!S&&V.light>0&&Math.hypot(px-o.x,py-o.y)>40)o.a+=V.light*dA(Math.atan2(py-o.y,px-o.x),o.a);
    const P=walk(o,r,next);if(P)bs.push(P);
  }
  T.pending=next;
  if(!bs.length)return null;
  const path=document.createElementNS(NS,'path');svg.appendChild(path);
  return{bs,path,dur:T.gen>1?V.speed:600,t0:performance.now()};
}

/* Polygon for a piece grown to fraction g, tip tapering to a point while it grows. */
function pathD(b,g){
  if(g<=0)return'';
  const n=b.n,f=g*n,k=Math.min(n-1,f|0),u=f-k;
  let s='M'+f1(b.lx[0])+' '+f1(b.ly[0]);
  for(let i=1;i<=k;i++)s+='L'+f1(b.lx[i])+' '+f1(b.ly[i]);
  const cx=b.cx[k]+(b.cx[k+1]-b.cx[k])*u,cy=b.cy[k]+(b.cy[k+1]-b.cy[k])*u;
  const lx=b.lx[k]+(b.lx[k+1]-b.lx[k])*u,ly=b.ly[k]+(b.ly[k+1]-b.ly[k])*u;
  const rx=b.rx[k]+(b.rx[k+1]-b.rx[k])*u,ry=b.ry[k]+(b.ry[k+1]-b.ry[k])*u;
  s+='L'+f1(cx+(lx-cx)*g)+' '+f1(cy+(ly-cy)*g)+'L'+f1(cx+(rx-cx)*g)+' '+f1(cy+(ry-cy)*g);
  for(let i=k;i>=0;i--)s+='L'+f1(b.rx[i])+' '+f1(b.ry[i]);
  return s+'Z';
}
function draw(a,p){
  let d='';
  for(const b of a.bs){const q=Math.min(1,Math.max(0,(p-b.dl)/.65));d+=pathD(b,1-Math.pow(1-q,3))}
  a.path.setAttribute('d',d);
}
function tick(now){
  if(!anim){raf=0;return}
  const p=Math.max(0,Math.min(1,(now-anim.t0)/anim.dur));
  draw(anim,p);
  if(p<1)raf=requestAnimationFrame(tick);else{anim=null;raf=0}
}
function step(px,py){
  if(anim){draw(anim,1);anim=null}
  if(!T)plant(px,py);
  anim=grow(px,py);
  if(anim&&!raf)raf=requestAnimationFrame(tick);
  hint.style.opacity=0;
}
function restart(){anim=null;T=null;grid.fill(0);dens.fill(0);nid=total=0;svg.replaceChildren();hint.style.opacity=1}
function autoLoop(){
  if(!auto)return;
  const t=performance.now();
  step(W*(.5+.42*Math.sin(t/2900)),H*(.4+.3*Math.cos(t/2100)));
  setTimeout(autoLoop,V.speed+120);
}

/* Save: the whole drawing as a standalone SVG. */
async function saveSvg(){
  if(anim){draw(anim,1);anim=null}
  if(!svg.querySelector('path'))return;
  const c=svg.cloneNode(true);
  c.setAttribute('width',W);c.setAttribute('height',H);
  c.querySelectorAll('path').forEach(p=>p.setAttribute('fill','#000'));
  const bg=document.createElementNS(NS,'rect');
  bg.setAttribute('width',W);bg.setAttribute('height',H);bg.setAttribute('fill','#fff');
  c.insertBefore(bg,c.firstChild);
  const data='<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(c),name='growth-'+preset+'.svg';
  let dl=null;
  try{dl=window.claude?await claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:name,data})}catch(e){}return}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([data],{type:'image/svg+xml'}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}

addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  step(p.x,p.y);
});
document.getElementById('ui').addEventListener('pointerdown',e=>e.stopPropagation());
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')restart()});
const panel=document.getElementById('panel'),tg=document.getElementById('tg'),au=document.getElementById('auto');
tg.onclick=()=>{panel.hidden=!panel.hidden;tg.setAttribute('aria-expanded',!panel.hidden)};
if(W<700){panel.hidden=true;tg.setAttribute('aria-expanded','false')}
sel.onchange=()=>{load(sel.value);restart()};
document.getElementById('rs').onclick=restart;
document.getElementById('df').onclick=()=>load(preset);
document.getElementById('sv').onclick=saveSvg;
au.onclick=()=>{auto^=1;au.setAttribute('aria-pressed',!!auto);if(auto)autoLoop()};
</script>
</body>
