<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Eyes Pie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bungee+Inline&family=Caveat:wght@700&family=Cinzel:wght@700;800&family=Courier+Prime:wght@700&family=DM+Sans:wght@700;800;900&family=Fredoka:wght@600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Special+Elite&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-navy: #24344D;
      --bg-slate: #314766;
      --cream: #EFECE6;
      --pie-gold: #E5B363;
      --pie-crust: #D69847;
      --cherry-red: #C9252D;
      --stem-green: #4BB543;
      --ink-brown: #2A1B15;
      --skin-peach: #F3C69F;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg-navy);
      color: var(--cream);
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Independent scroll container so scrolling works even inside <iframe scrolling="no"> on bubhub.us */
    #lobbyScreen:not(.hidden) {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      display: block;
    }

    #lobbyScreen:not(.hidden) * {
      touch-action: pan-y;
    }


    /* START always visible: pinned to the bottom of the screen */
    #lobbyScreen:not(.hidden) #startBtn {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: max(12px, env(safe-area-inset-bottom));
      width: calc(100% - 24px);
      max-width: 28rem;
      z-index: 40;
      box-shadow: 0 -10px 24px rgba(36,52,77,.95), 0 8px 16px rgba(0,0,0,.4);
    }
    #lobbyScreen:not(.hidden) #startBtn:active { transform: translateX(-50%) translateY(2px); }
    #lobbyScreen:not(.hidden) { padding-bottom: 104px !important; }

    #gameScreen:not(.hidden) {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .paper-sheet {
      background-color: var(--cream);
      box-shadow: 
        0 18px 40px rgba(0, 0, 0, 0.55),
        inset 0 0 24px rgba(43, 29, 22, 0.08);
      border: 3px solid #DFD9CE;
    }

    .svg-item {
      cursor: pointer;
      touch-action: none;
      transition: opacity 0.1s ease;
    }
    .svg-item:active {
      opacity: 0.55;
    }


    /* ---- big, kid-friendly tiles for the lobby ---- */
    .tile {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; line-height: 1.1; font-weight: 900; cursor: pointer;
      border: 3px solid; border-radius: 1rem;
      transition: transform .1s ease;
    }
    .tile:active { transform: scale(.95); }
    .tile-on  { background: var(--pie-gold); color: var(--ink-brown); border-color: var(--pie-crust); box-shadow: 0 3px 0 var(--pie-crust); }
    .tile-off { background: var(--bg-navy); color: rgba(239,236,230,.6); border-color: #435E85; }
    .tile .tick {
      display: none; position: absolute; top: -7px; right: -7px;
      width: 22px; height: 22px; border-radius: 50%;
      align-items: center; justify-content: center;
      background: var(--stem-green); color: #fff; font-size: 13px; font-family: 'DM Sans', sans-serif;
      border: 2px solid var(--bg-slate);
    }
    .tile-on .tick { display: flex; }
    .shake { animation: shake .3s; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    /* ---- pie reward + hint ---- */
    .pie-pop { transform-box: view-box; transform-origin: 50% 50%; animation: piePop .4s ease-out; }
    @keyframes piePop { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
    .done-pop { animation: donePop .55s cubic-bezier(.2, 1.6, .4, 1); }
    @keyframes donePop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .hint-ring { animation: hintPulse .9s ease-in-out infinite; pointer-events: none; }
    @keyframes hintPulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    .sum-win { background: rgba(229,179,99,.18); border-color: var(--pie-gold) !important; }

    @keyframes ringPulse {
      0% { r: 16; opacity: 1; stroke-width: 8; }
      100% { r: 58; opacity: 0; stroke-width: 2; }
    }
    .beacon-circle {
      animation: ringPulse 0.9s ease-out infinite;
    }
  </style>
</head>
<body>

  <!-- ==================== SCREEN 1: ULTRA-MINIMAL LOBBY ==================== -->
  <main id="lobbyScreen" class="p-3 sm:p-5 pb-24">
    <div class="w-full max-w-md mx-auto flex flex-col items-center justify-start gap-3 sm:gap-4 py-2">
      
      <!-- HERO: Custom SVG Replica of Attached Icon + Title ONLY -->
      <div class="flex flex-col items-center gap-1.5 sm:gap-2.5 shrink-0">
        <div class="w-16 h-16 sm:w-24 sm:h-24 rounded-[26%] bg-[#24344D] border-4 border-[#314766] shadow-2xl overflow-hidden flex items-center justify-center relative">
          <svg viewBox="0 0 200 200" class="w-full h-full">
            <!-- Outer Navy Square & Slate Circle -->
            <rect width="200" height="200" rx="44" fill="#24344D"/>
            <circle cx="100" cy="106" r="78" fill="#314766"/>
            
            <!-- Cream Shirt & Shoulders -->
            <path d="M26 200 C30 154 58 144 100 144 C142 144 170 154 174 200 Z" fill="#EFECE6"/>
            <path d="M52 200 C56 172 64 164 68 160" stroke="#D5D0C5" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M148 200 C144 172 136 164 132 160" stroke="#D5D0C5" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            
            <!-- Neck & Collar -->
            <rect x="83" y="130" width="34" height="22" rx="8" fill="#DDA982"/>
            <path d="M74 144 Q100 160 126 144" fill="none" stroke="#D5D0C5" stroke-width="5" stroke-linecap="round"/>

            <!-- Ears -->
            <ellipse cx="49" cy="102" rx="9" ry="14" fill="#F2C6A0"/>
            <ellipse cx="49" cy="102" rx="4.5" ry="8" fill="#DDA982"/>
            <ellipse cx="151" cy="102" rx="9" ry="14" fill="#F2C6A0"/>
            <ellipse cx="151" cy="102" rx="4.5" ry="8" fill="#DDA982"/>

            <!-- Head -->
            <path d="M52 84 C52 50 148 50 148 84 C150 124 132 144 100 144 C68 144 50 124 52 84 Z" fill="#F2C6A0"/>

            <!-- Spiky Dark Brown Hair -->
            <path d="M51 90 C48 70 52 58 55 54 L46 47 L66 46 L62 35 L82 40 L94 24 L100 35 L108 20 L118 39 L140 33 L135 46 L154 49 L144 56 C148 66 150 78 149 90 C146 72 136 62 128 58 C110 64 86 64 70 58 C60 64 54 74 51 90 Z" fill="#2B1D16"/>
            <path d="M76 47 Q90 40 103 44" stroke="#53392D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <path d="M110 44 Q122 40 132 48" stroke="#53392D" stroke-width="2.5" stroke-linecap="round" fill="none"/>

            <!-- Eyebrows -->
            <path d="M60 72 Q76 69 92 75" stroke="#2B1D16" stroke-width="6.5" stroke-linecap="round" fill="none"/>
            <path d="M108 71 Q124 63 138 72" stroke="#2B1D16" stroke-width="6.5" stroke-linecap="round" fill="none"/>

            <!-- Blush Cheeks -->
            <ellipse cx="67" cy="116" rx="10" ry="6" fill="#E59882" opacity="0.75"/>
            <ellipse cx="133" cy="114" rx="10" ry="6" fill="#E59882" opacity="0.75"/>

            <!-- LEFT PIE SLICE EYE -->
            <g transform="translate(76, 95) rotate(-6)">
              <!-- 3D Filling Side -->
              <polygon points="-22,-2 0,18 22,-2 22,5 0,25 -22,5" fill="#D69847"/>
              <polygon points="-21,0 0,20 21,0 21,4 0,24 -21,4" fill="#9E1B22"/>
              <!-- Top Lattice Crust -->
              <path d="M-23,-2 Q0,-18 23,-2 L0,19 Z" fill="#E5B363" stroke="#D69847" stroke-width="1.5"/>
              <!-- Berry Lattice Cutouts -->
              <polygon points="-10,-4 -4,-8 0,-4 -6,0" fill="#9E1B22"/>
              <polygon points="4,-8 10,-4 6,0 0,-4" fill="#9E1B22"/>
              <polygon points="-4,2 0,-1 4,2 0,6" fill="#9E1B22"/>
              <!-- Crust Rim -->
              <path d="M-23,-2 Q0,-17 23,-2" fill="none" stroke="#ECC37E" stroke-width="4" stroke-linecap="round"/>
              <!-- Cherry & Green Stem -->
              <circle cx="0" cy="-2" r="6.5" fill="#C9252D"/>
              <circle cx="-2" cy="-4" r="1.8" fill="#F29B9E"/>
              <path d="M0,-7 Q4,-16 11,-17" fill="none" stroke="#38B449" stroke-width="2.5" stroke-linecap="round"/>
            </g>

            <!-- RIGHT PIE SLICE EYE -->
            <g transform="translate(125, 95) rotate(6)">
              <polygon points="-22,-2 0,18 22,-2 22,5 0,25 -22,5" fill="#D69847"/>
              <polygon points="-21,0 0,20 21,0 21,4 0,24 -21,4" fill="#9E1B22"/>
              <path d="M-23,-2 Q0,-18 23,-2 L0,19 Z" fill="#E5B363" stroke="#D69847" stroke-width="1.5"/>
              <polygon points="-10,-4 -4,-8 0,-4 -6,0" fill="#9E1B22"/>
              <polygon points="4,-8 10,-4 6,0 0,-4" fill="#9E1B22"/>
              <polygon points="-4,2 0,-1 4,2 0,6" fill="#9E1B22"/>
              <path d="M-23,-2 Q0,-17 23,-2" fill="none" stroke="#ECC37E" stroke-width="4" stroke-linecap="round"/>
              <circle cx="0" cy="-2" r="6.5" fill="#C9252D"/>
              <circle cx="-2" cy="-4" r="1.8" fill="#F29B9E"/>
              <path d="M0,-7 Q4,-16 11,-17" fill="none" stroke="#38B449" stroke-width="2.5" stroke-linecap="round"/>
            </g>

            <!-- Nose -->
            <path d="M97 104 C93 114 97 118 105 115" fill="none" stroke="#8C583A" stroke-width="3" stroke-linecap="round"/>

            <!-- Big Toothy Grin -->
            <path d="M76 122 Q102 126 127 116 C124 134 110 140 96 139 C84 138 78 130 76 122 Z" fill="#FFFFFF" stroke="#2B1D16" stroke-width="4" stroke-linejoin="round"/>
            <line x1="91" y1="124" x2="91" y2="137" stroke="#2B1D16" stroke-width="2.8"/>
            <line x1="103" y1="123" x2="103" y2="138" stroke="#2B1D16" stroke-width="2.8"/>
            <line x1="115" y1="120" x2="115" y2="135" stroke="#2B1D16" stroke-width="2.8"/>
          </svg>
        </div>

        <h1 class="text-3xl sm:text-5xl font-bold tracking-wide text-[#EFECE6]" style="font-family: 'Fredoka', sans-serif;">
          EYES <span class="text-[#E5B363]">PIE</span>
        </h1>
      </div>

      <!-- COMPACT LOBBY CARD -->
      <div class="w-full bg-[#314766] border-2 border-[#435E85] rounded-3xl p-3.5 sm:p-5 shadow-2xl space-y-3 shrink-0">

        <!-- Score pill: rounds won -->
        <div class="flex items-center justify-between bg-[#24344D] px-3.5 py-1.5 sm:py-2 rounded-2xl border border-[#435E85]">
          <div class="flex items-center gap-3 text-sm font-extrabold tracking-wide">
            <span class="text-[#E5B363]">P1: <span id="lobbyP1Score">0</span></span>
            <span class="text-[#435E85]">|</span>
            <span class="text-[#F2C6A0]">P2: <span id="lobbyP2Score">0</span></span>
          </div>
          <button onclick="resetMatchScores()" title="Reset Score" class="text-xs font-bold text-[#EFECE6]/70 hover:text-[#EFECE6] px-2 py-0.5 rounded-lg bg-[#314766]">
            ↺
          </button>
        </div>

        <!-- FIND: what shows up on the board (the tile shows an example) -->
        <div class="space-y-2">
          <div class="text-[11px] font-extrabold uppercase tracking-widest text-[#E5B363]">Find</div>
          <div class="grid grid-cols-3 gap-2.5">
          <button type="button" data-cat="numbers" onclick="toggleCat('numbers')" class="cat-pill tile h-14 text-2xl" style="font-family:'Fredoka',sans-serif;">
            <span>42</span><span class="tick">✓</span>
          </button>
          <button type="button" data-cat="bigrams" onclick="toggleCat('bigrams')" class="cat-pill tile h-14 text-2xl" style="font-family:'Fredoka',sans-serif;">
            <span>ab</span><span class="tick">✓</span>
          </button>
          <button type="button" data-cat="words" onclick="toggleCat('words')" class="cat-pill tile h-14 text-2xl" style="font-family:'Fredoka',sans-serif;">
            <span>cat</span><span class="tick">✓</span>
          </button>
          <button type="button" data-cat="words4" onclick="toggleCat('words4')" class="cat-pill tile h-14 text-2xl" style="font-family:'Fredoka',sans-serif;">
            <span>frog</span><span class="tick">✓</span>
          </button>
          <button type="button" data-cat="words5" onclick="toggleCat('words5')" class="cat-pill tile h-14 text-2xl" style="font-family:'Fredoka',sans-serif;">
            <span>apple</span><span class="tick">✓</span>
          </button>
          <button type="button" data-cat="polygons" onclick="toggleCat('polygons')" class="cat-pill tile h-14 text-2xl" style="font-family:'Fredoka',sans-serif;">
            <span><svg viewBox="0 0 100 100" class="w-9 h-9"><path d="M50 7 L62 35 L93 36 L68 55 L77 86 L50 68 L23 86 L32 55 L7 36 L38 35 Z" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round"/></svg></span><span class="tick">✓</span>
          </button>
          </div>
        </div>

        <!-- PLAY: who picks the 5 things -->
        <div class="space-y-2">
          <div class="text-[11px] font-extrabold uppercase tracking-widest text-[#E5B363]">Play</div>
          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" id="modeAutoBtn" onclick="setGameMode('auto')" class="tile py-2">
              <span class="text-2xl leading-none">🎲</span>
              <span class="text-sm">SURPRISE</span>
              <span class="text-[11px] font-bold opacity-70">we pick</span>
            </button>
            <button type="button" id="modeHumanBtn" onclick="setGameMode('junebug')" class="tile py-2">
              <span class="text-2xl leading-none">🐞</span>
              <span class="text-sm">JUNEBUG</span>
              <span class="text-[11px] font-bold opacity-70">friend picks</span>
            </button>
          </div>
        </div>

        <!-- HOW MANY -->
        <div class="space-y-2">
          <div class="text-[11px] font-extrabold uppercase tracking-widest text-[#E5B363]">How many</div>
          <div class="grid grid-cols-3 gap-2.5">
            <button type="button" id="densEasyBtn" onclick="setDensity('easy')" class="tile py-2">
              <span class="text-xs leading-none">⭐</span><span class="text-sm">EASY</span>
            </button>
            <button type="button" id="densMedBtn" onclick="setDensity('medium')" class="tile py-2">
              <span class="text-xs leading-none">⭐⭐</span><span class="text-sm">MEDIUM</span>
            </button>
            <button type="button" id="densHardBtn" onclick="setDensity('hard')" class="tile py-2">
              <span class="text-xs leading-none">⭐⭐⭐</span><span class="text-sm">HARD</span>
            </button>
          </div>
        </div>

        <!-- MOVE -->
        <div class="space-y-2">
          <div class="text-[11px] font-extrabold uppercase tracking-widest text-[#E5B363]">Move</div>
          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" id="moveOffBtn" onclick="setMoving(false)" class="tile py-2">
              <span class="text-xl leading-none">😴</span><span class="text-sm">STILL</span>
            </button>
            <button type="button" id="moveOnBtn" onclick="setMoving(true)" class="tile py-2">
              <span class="text-xl leading-none">🌀</span><span class="text-sm">WIGGLE</span>
            </button>
          </div>
        </div>

        <!-- START BUTTON (pinned to bottom of viewport so it is always reachable) -->
        <button id="startBtn" onclick="startMatchFromLobby()" class="w-full py-3.5 sm:py-4 rounded-2xl bg-[#C9252D] hover:bg-[#d92c35] text-[#EFECE6] font-black text-2xl tracking-wider uppercase shadow-lg border-b-4 border-[#8E161C] active:translate-y-0.5 transition">
          PLAY ▶
        </button>

      </div>
    </div>
  </main>

  <!-- ==================== SCREEN 2: MINIMAL PASS OVERLAY ==================== -->
  <section id="curtainScreen" class="hidden fixed inset-0 z-50 bg-[#24344D] flex flex-col items-center justify-center p-6 text-center">
    <div class="max-w-xs w-full bg-[#314766] border-2 border-[#435E85] rounded-3xl p-6 shadow-2xl space-y-5">
      <div id="curtainTitle" class="text-3xl font-black text-[#EFECE6] uppercase tracking-wide">
        PASS TO P1
      </div>
      <div id="curtainSub" class="hidden text-base font-extrabold text-[#E5B363]"></div>
      <button onclick="onCurtainConfirm()" class="w-full py-5 rounded-2xl bg-[#38B449] hover:bg-[#42c754] text-[#2A1B15] font-black text-3xl uppercase tracking-wider shadow-lg border-b-4 border-[#237A30] active:translate-y-0.5 transition">
        GO!
      </button>
    </div>
  </section>

  <!-- ==================== SCREEN 3: ACTIVE GAMEPLAY & SVG JUMBLE ==================== -->
  <section id="gameScreen" class="hidden flex-1 flex flex-col w-full max-w-4xl mx-auto p-1.5 sm:p-3 gap-1.5 sm:gap-2 h-full overflow-hidden">
    
    <!-- HUD: row 1 = back, who + pie, clock.  Row 2 = what to find (full width, never cut off) -->
    <header class="bg-[#314766] border-2 border-[#435E85] rounded-2xl px-2.5 py-1.5 flex flex-wrap items-center justify-between gap-x-2 gap-y-1.5 shrink-0 shadow-lg">

      <div class="flex items-center gap-1.5">
        <button onclick="returnToLobby()" class="w-11 h-11 rounded-xl bg-[#24344D] text-[#EFECE6] text-lg font-black flex items-center justify-center border border-[#435E85] active:scale-95 transition">
          ✕
        </button>
        <div class="bg-[#24344D] pl-2.5 pr-1.5 py-0.5 rounded-xl border border-[#435E85] flex items-center gap-1.5">
          <span id="hudPlayerTag" class="text-sm font-black text-[#E5B363]">P1</span>
          <span id="hudPie" class="block w-10 h-10"></span>
        </div>
      </div>

      <div class="order-last w-full sm:order-none sm:w-auto sm:flex-1 flex items-center justify-center min-w-0">
        <!-- Hunt target -->
        <div id="hudHuntBox" class="bg-[#EFECE6] text-[#2A1B15] px-4 py-1 rounded-xl border-2 border-[#D69847] min-h-[52px] flex items-center justify-center gap-2 shadow-inner max-w-full">
          <div id="hudCanonicalBadge" class="font-black flex flex-wrap items-center justify-center gap-x-2 text-center"></div>
        </div>

        <!-- Junebug: pick 5 -->
        <div id="hudPickBox" class="hidden bg-[#24344D] border-2 border-[#E5B363] px-3 py-1.5 rounded-xl flex items-center gap-3">
          <span id="hudPickText" class="text-sm sm:text-base font-black text-[#E5B363] uppercase">PICK 5</span>
          <button id="pickDoneBtn" onclick="finishTargetSelectionPhase()" disabled class="px-4 py-2 rounded-lg bg-[#4BB543] text-[#2A1B15] font-black text-sm uppercase opacity-40">
            DONE
          </button>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <div id="clockBox" class="bg-[#24344D] border border-[#435E85] rounded-xl px-3 py-2 min-w-[70px] text-center">
          <span id="clockText" class="text-base font-mono font-black text-[#E5B363]">0.0s</span>
        </div>
      </div>

    </header>

    <!-- RESPONSIVE SVG JUMBLE SHEET (Guaranteed 800x1050 Logical Space) -->
    <div class="flex-1 w-full flex items-center justify-center overflow-hidden relative">
      <div class="paper-sheet w-full h-full rounded-2xl flex items-center justify-center overflow-hidden relative">
        <svg id="jumbleSvg" viewBox="0 0 800 1050" preserveAspectRatio="xMidYMid meet" class="w-full h-full block select-none">
          <defs>
            <pattern id="svgStripePattern" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
              <line x1="0" y1="0" x2="0" y2="12" stroke="#2A1B15" stroke-width="4.5" />
            </pattern>
            <pattern id="svgDotPattern" width="18" height="18" patternUnits="userSpaceOnUse">
              <circle cx="9" cy="9" r="3.8" fill="#2A1B15" />
            </pattern>
          </defs>
          <!-- Jumble items & feedback rings injected directly here -->
          <g id="jumbleLayer"></g>
          <g id="feedbackLayer"></g>
        </svg>

        <!-- Leg finished: baked pie + your time -->
        <div id="doneOverlay" class="hidden absolute inset-0 bg-[#24344D]/90 flex flex-col items-center justify-center gap-3 z-10">
          <div id="donePie" class="done-pop w-44 h-44"></div>
          <div id="doneTime" class="done-pop text-6xl font-black text-[#EFECE6]" style="font-family:'Fredoka',sans-serif;">0.0s</div>
        </div>
      </div>
    </div>

  </section>

  <!-- ==================== SCREEN 4: MINIMAL TURN SUMMARY MODAL ==================== -->
  <section id="summaryModal" class="hidden fixed inset-0 z-50 bg-[#24344D]/90 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="max-w-xs w-full bg-[#314766] border-2 border-[#435E85] rounded-3xl p-6 shadow-2xl space-y-5 text-center">

      <div id="summaryTurnTitle" class="text-3xl font-black text-[#E5B363] uppercase">
        P1 WINS!
      </div>

      <div class="grid grid-cols-2 gap-3 bg-[#24344D] p-3 rounded-2xl border border-[#435E85]">
        <div id="sumCell1" class="rounded-xl p-2 border-2 border-transparent">
          <div class="text-sm font-extrabold text-[#E5B363]">P1</div>
          <div id="sumP1Time" class="text-3xl font-black text-[#EFECE6]">0.0s</div>
          <div id="sumP1Wins" class="text-[11px] font-extrabold text-[#EFECE6]/60">WINS: 0</div>
        </div>
        <div id="sumCell2" class="rounded-xl p-2 border-2 border-transparent">

    /********************************************************************
     * 2. WEB AUDIO SYNTH
     ********************************************************************/
    let audioCtx = null;
    function playTone(type) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx && AudioContextClass) audioCtx = new AudioContextClass();
        if (!audioCtx) return;
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === "win") {
          [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = "triangle";
            o.frequency.setValueAtTime(f, now + i * 0.11);
            g.gain.setValueAtTime(0.0001, now + i * 0.11);
            g.gain.exponentialRampToValueAtTime(0.2, now + i * 0.11 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.3);
            o.start(now + i * 0.11);
            o.stop(now + i * 0.11 + 0.32);
          });
          return;
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "find") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(783.99, now + 0.06);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === "wrong") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.linearRampToValueAtTime(110, now + 0.12);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
          osc.start(now);
          osc.stop(now + 0.13);
        } else if (type === "queue") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(660, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === "timesup") {
          osc.type = "square";
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(280, now + 0.15);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        }
      } catch (e) {}
    }

    /********************************************************************
     * 4. SVG JUMBLE GENERATOR
     ********************************************************************/
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildCandidatePool(targetCount) {
      const pools = [];

      if (state.categories.numbers) {
        const list = [];
        for (let n = 1; n <= 99; n++) {
          list.push({
            uid: `num_${n}`,
            category: "number",
            canonicalText: String(n),
            boardText: String(n),
            underline: AMBIGUOUS_NUMBERS.has(n)
          });
        }
        pools.push(shuffleArray(list));
      }

      if (state.categories.bigrams) {
        const list = UNIQUE_BIGRAMS.map(bg => {
          const r = Math.random();
          const txt = r < 0.35 ? bg.toLowerCase() : (r < 0.7 ? bg[0] + bg[1].toLowerCase() : bg);
          return {
            uid: `bi_${bg}`,
            category: "bigram",
            canonicalText: bg,
            boardText: txt,
            underline: true
          };
        });
        pools.push(shuffleArray(list));
      }

      const WORD_SETS = [
        { cat: "words",  list: UNIQUE_WORDS },
        { cat: "words4", list: UNIQUE_WORDS_4 },
        { cat: "words5", list: UNIQUE_WORDS_5 }
      ];
      for (const set of WORD_SETS) {
        if (!state.categories[set.cat]) continue;
        const list = set.list.map(w => {
          const r = Math.random();
          const txt = r < 0.35 ? w.toLowerCase() : (r < 0.7 ? w[0] + w.slice(1).toLowerCase() : w);
          return {
            uid: `word_${w}`,
            category: "word",
            canonicalText: w,
            boardText: txt,
            underline: true
          };
        });
        pools.push(shuffleArray(list));
      }

      if (state.categories.polygons) {
        const list = [];
        for (const base of BASE_POLYGONS) {
          for (const mod of POLYGON_MODIFIERS) {
            list.push({
              uid: `poly_${base.id}_${mod.id}`,
              category: "polygon",
              canonicalText: `${mod.label} ${base.name}`,
              baseShape: base,
              modifier: mod
            });
          }
        }
        pools.push(shuffleArray(list));
      }

      const selected = [];
      let idx = 0;
      while (selected.length < targetCount) {
        let added = false;
        for (const p of pools) {
          if (idx < p.length && selected.length < targetCount) {
            selected.push(p[idx]);
            added = true;
          }
        }
        if (!added) break;
        idx++;
      }

      return shuffleArray(selected);
    }

    function getPolygonInnerMarkup(baseShape, modifier) {
      const strokeW = 7.5;
      let fill = "none";
      if (modifier.id === "solid") fill = "#2A1B15";
      else if (modifier.id === "striped") fill = "url(#svgStripePattern)";
      else if (modifier.id === "dotted") fill = "url(#svgDotPattern)";

      let extra = "";
      if (modifier.id === "double") {
        extra = `<path d="${baseShape.path}" transform="translate(50,50) scale(0.56) translate(-50,-50)" fill="none" stroke="#2A1B15" stroke-width="8.5" stroke-linejoin="round" stroke-linecap="round"/>`;
      }

      return `<path d="${baseShape.path}" fill="${fill}" stroke="#2A1B15" stroke-width="${strokeW}" stroke-linejoin="round" stroke-linecap="round"/>${extra}`;
    }

    function buildVisualItemGroup(item, sizeOverride) {
      const ns = "http://www.w3.org/2000/svg";
      const sz = sizeOverride || item.size;
      const g = document.createElementNS(ns, "g");
      g.setAttribute("transform", `rotate(${item.rot}) scale(${item.sx}, ${item.sy})`);

      if (item.category === "number" || item.category === "bigram" || item.category === "word") {
        const textEl = document.createElementNS(ns, "text");
        textEl.setAttribute("x", "0");
        textEl.setAttribute("y", "0");
        textEl.setAttribute("text-anchor", "middle");
        textEl.setAttribute("dominant-baseline", "central");
        textEl.setAttribute("font-family", item.fontSpec.family);
        textEl.setAttribute("font-weight", item.fontSpec.weight);
        textEl.setAttribute("font-style", item.fontSpec.style);
        textEl.setAttribute("font-size", String(sz));

        if (item.fontSpec.outline) {
          textEl.setAttribute("fill", "#EFECE6");
          textEl.setAttribute("stroke", "#2A1B15");
          textEl.setAttribute("stroke-width", "3");
        } else {
          textEl.setAttribute("fill", "#2A1B15");
        }

        textEl.textContent = item.boardText;
        g.appendChild(textEl);

        if (item.underline) {
          const line = document.createElementNS(ns, "line");
          const halfW = sz * 0.44;
          const yOff = sz * 0.50;
          line.setAttribute("x1", String(-halfW));
          line.setAttribute("y1", String(yOff));
          line.setAttribute("x2", String(halfW));
          line.setAttribute("y2", String(yOff));
          line.setAttribute("stroke", "#2A1B15");
          line.setAttribute("stroke-width", "4");
          line.setAttribute("stroke-linecap", "round");
          g.appendChild(line);
        }
      } else if (item.category === "polygon") {
        const innerG = document.createElementNS(ns, "g");
        const s = sz / 100;
        innerG.setAttribute("transform", `scale(${s}) translate(-50, -50)`);
        innerG.innerHTML = getPolygonInnerMarkup(item.baseShape, item.modifier);
        g.appendChild(innerG);
      }

      return g;
    }

    function measureRotatedItemBounds(item, curSize, layer) {
      const ns = "http://www.w3.org/2000/svg";
      const wrapper = document.createElementNS(ns, "g");
      const visualG = buildVisualItemGroup(item, curSize);
      wrapper.appendChild(visualG);
      layer.appendChild(wrapper);

      let bw = 0, bh = 0;
      try {
        const b = wrapper.getBBox();
        bw = b.width;
        bh = b.height;
      } catch (e) {}
      wrapper.remove();

      let charW = 1.05;
      if (item.category === "number") charW = item.boardText.length === 1 ? 0.82 : 1.38;
      else if (item.category === "bigram") charW = 1.55;
      else if (item.category === "word") charW = item.canonicalText.length <= 3 ? 2.25 : 0.64 * item.canonicalText.length;

      const rawW = curSize * charW * item.sx;
      const rawH = curSize * 1.02 * item.sy;
      const rad = (item.rot * Math.PI) / 180;
      const cos = Math.abs(Math.cos(rad));
      const sin = Math.abs(Math.sin(rad));
      const estW = rawW * cos + rawH * sin;
      const estH = rawW * sin + rawH * cos;

      const finalW = Math.max(bw, estW);
      const finalH = Math.max(bh, estH);

      return {
        halfW: finalW / 2,
        halfH: finalH / 2
      };
    }

    function generateAndRenderSvgJumble() {
      const cfg = DENSITY[state.densityKey] || DENSITY.easy;
      const candidates = buildCandidatePool(cfg.count);
      const count = candidates.length;

      document.getElementById("jumbleLayer").innerHTML = "";
      document.getElementById("feedbackLayer").innerHTML = "";

      const rawItems = candidates.map((item, idx) => {
        const isGraphic = item.category === "polygon";
        const minAllowed = cfg.min + (isGraphic ? 4 : 0);
        const maxAllowed = cfg.max + (isGraphic ? 4 : 0);

        // a few big ones, a bunch of medium ones, the rest small (within this density's range)
        const ratio = idx / count;
        const t = ratio < 0.16 ? 0.85 + Math.random() * 0.15
                : ratio < 0.55 ? 0.40 + Math.random() * 0.30
                : Math.random() * 0.25;
        const size = Math.round(minAllowed + (maxAllowed - minAllowed) * t);

        const velocity = state.moving ? { vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8 } : {};

        return {
          ...item,
          size,
          ...velocity,
          minSize: minAllowed,
          fontSpec: FONT_STYLES[Math.floor(Math.random() * FONT_STYLES.length)],
          rot: Math.round((Math.random() * 2 - 1) * cfg.rotRange),
          sx: +(0.94 + Math.random() * 0.14).toFixed(2),
          sy: +(0.94 + Math.random() * 0.14).toFixed(2)
        };
      });

      state.boardItems = placeItems(rawItems);
      renderSvgItemsToDOM();
    }

    // Scatter items on the 800x1050 sheet without overlaps. Returns the ones that fit.
    function placeItems(rawItems) {
      const W = 800;
      const H = 1050;
      const layer = document.getElementById("jumbleLayer");
      const ordered = [...rawItems].sort((a, b) => b.size - a.size);

      const placedBoxes = [];
      const placedItems = [];
      const outerMargin = 24;
      const safetyPad = 8;

      for (const item of ordered) {
        let curSize = item.size;
        let placed = false;

        while (curSize >= item.minSize && !placed) {
          const { halfW, halfH } = measureRotatedItemBounds(item, curSize, layer);
          const rx = halfW + safetyPad;
          const ry = halfH + safetyPad;

          const minX = outerMargin + halfW;
          const maxX = W - outerMargin - halfW;
          const minY = outerMargin + halfH;
          const maxY = H - outerMargin - halfH;

          if (minX < maxX && minY < maxY) {
            for (let attempt = 0; attempt < 260; attempt++) {
              const cx = minX + Math.random() * (maxX - minX);
              const cy = minY + Math.random() * (maxY - minY);

              let hit = false;
              for (let i = 0; i < placedBoxes.length; i++) {
                const b = placedBoxes[i];
                if (Math.abs(cx - b.cx) < (rx + b.halfW) && Math.abs(cy - b.cy) < (ry + b.halfH)) {
                  hit = true;
                  break;
                }
              }

              if (!hit) {
                item.size = Math.round(curSize);
                item.cx = Math.round(cx);
                item.cy = Math.round(cy);
                item.hitR = Math.max(28, Math.round(Math.max(halfW, halfH) + 6));
                placedBoxes.push({ cx, cy, halfW, halfH });
                placedItems.push(item);
                placed = true;
                break;
              }
            }
          }

          if (!placed) {
            if (curSize === item.minSize) break;
            curSize = Math.max(item.minSize, curSize - 4);
          }
        }
      }
      return placedItems;
    }

    // Second player gets the SAME things, scattered in NEW spots (so watching the first player doesn't help)
    function relayoutSameItems() {
      const base = state.boardItems;
      for (let attempt = 0; attempt < 12; attempt++) {
        const clones = base.map(({ el, hintEl, ...rest }) => ({ ...rest }));
        const placed = placeItems(clones);
        if (placed.length === base.length) {
          state.boardItems = placed;
          break;
        }
      }
      renderSvgItemsToDOM();
    }

    function renderSvgItemsToDOM() {
      const layer = document.getElementById("jumbleLayer");
      const fbLayer = document.getElementById("feedbackLayer");
      layer.innerHTML = "";
      fbLayer.innerHTML = "";

      const ns = "http://www.w3.org/2000/svg";

      state.boardItems.forEach(item => {
        const g = document.createElementNS(ns, "g");
        g.setAttribute("class", "svg-item");
        g.setAttribute("transform", `translate(${item.cx}, ${item.cy})`);
        item.el = g;

        const hitCircle = document.createElementNS(ns, "circle");
        hitCircle.setAttribute("cx", "0");
        hitCircle.setAttribute("cy", "0");
        hitCircle.setAttribute("r", String(item.hitR));
        hitCircle.setAttribute("fill", "transparent");
        g.appendChild(hitCircle);

        const visualG = buildVisualItemGroup(item, item.size);
        g.appendChild(visualG);

        const badgeG = document.createElementNS(ns, "g");
        badgeG.setAttribute("id", `qbadge_${item.uid}`);
        badgeG.setAttribute("class", "hidden");
        badgeG.innerHTML = `
          <circle cx="0" cy="0" r="24" fill="#C9252D" stroke="#EFECE6" stroke-width="3.5"/>
          <text id="qtext_${item.uid}" x="0" y="1" text-anchor="middle" dominant-baseline="central" fill="#EFECE6" font-weight="900" font-size="22">1</text>
        `;
        g.appendChild(badgeG);

        g.addEventListener("pointerdown", (e) => {
          e.stopPropagation();
          onItemTapped(item, g);
        });

        layer.appendChild(g);
      });
    }

    /********************************************************************
     * 5. ROUND FLOW
     *    A round = two hunts on the same 5 targets. Lowest time wins.
     *    Surprise: 5 random targets.  Junebug: your friend picks the 5.
     ********************************************************************/
    function startMatchFromLobby() {
      document.getElementById("lobbyScreen").classList.add("hidden");
      document.getElementById("summaryModal").classList.add("hidden");
      document.getElementById("curtainScreen").classList.add("hidden");
      document.getElementById("doneOverlay").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
      startRound();
    }

    function startRound() {
      clearActiveTimer();
      state.times = { 1: null, 2: null };
      state.leg = 0;
      state.hunter = state.firstHunter;
      setupLeg();
    }

    function setupLeg(curtainSub) {
      clearActiveTimer();
      document.getElementById("doneOverlay").classList.add("hidden");

      if (state.mode === "junebug") {
        // fresh board every leg; the other player picks 5 things for the hunter
        generateAndRenderSvgJumble();
        beginPickPhase();
        return;
      }

      if (state.leg === 0) {
        generateAndRenderSvgJumble();
        state.targetUids = shuffleArray(state.boardItems).slice(0, TARGETS_PER_ROUND).map(it => it.uid);
        showCurtain(`P${state.hunter} READY?`, `Find ${TARGETS_PER_ROUND}!`, beginHunt);
      } else {
        relayoutSameItems();
        showCurtain(`PASS TO P${state.hunter}`, curtainSub, beginHunt);
      }
    }

    function showCurtain(titleText, subText, callback) {
      clearActiveTimer();
      state.phase = "curtain";
      state.nextCurtainAction = callback;
      document.getElementById("curtainTitle").textContent = titleText;
      const sub = document.getElementById("curtainSub");
      sub.textContent = subText || "";
      sub.classList.toggle("hidden", !subText);
      document.getElementById("curtainScreen").classList.remove("hidden");
    }

    function onCurtainConfirm() {
      document.getElementById("curtainScreen").classList.add("hidden");
      if (state.nextCurtainAction) state.nextCurtainAction();
    }

    /* ---------- the pie (progress + reward) ---------- */
    function pieSvg(n, popLast) {
      const total = TARGETS_PER_ROUND;
      const cx = 50, cy = 50, r = 44;
      let out = "";
      for (let i = 0; i < total; i++) {
        const a1 = (-90 + (i * 360) / total) * Math.PI / 180;
        const a2 = (-90 + ((i + 1) * 360) / total) * Math.PI / 180;
        const x1 = (cx + r * Math.cos(a1)).toFixed(1), y1 = (cy + r * Math.sin(a1)).toFixed(1);
        const x2 = (cx + r * Math.cos(a2)).toFixed(1), y2 = (cy + r * Math.sin(a2)).toFixed(1);
        const d = `M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 0 1 ${x2} ${y2} Z`;

        if (i < n) {
          const mid = (a1 + a2) / 2;
          const bx = (cx + r * 0.6 * Math.cos(mid)).toFixed(1);
          const by = (cy + r * 0.6 * Math.sin(mid)).toFixed(1);
          const cls = popLast && i === n - 1 ? ' class="pie-pop"' : "";
          out += `<g${cls}>
            <path d="${d}" fill="#E5B363" stroke="#D69847" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="${bx}" cy="${by}" r="7.5" fill="#C9252D"/>
            <circle cx="${(bx - 2.2).toFixed(1)}" cy="${(by - 2.4).toFixed(1)}" r="2" fill="#F29B9E"/>
          </g>`;
        } else {
          out += `<path d="${d}" fill="rgba(239,236,230,0.10)" stroke="#435E85" stroke-width="2.5" stroke-linejoin="round"/>`;
        }
      }
      if (n >= total) {
        out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#D69847" stroke-width="5"/>`;
      }
      return `<svg viewBox="0 0 100 100" class="w-full h-full">${out}</svg>`;
    }

    function setHudPie(n, popLast) {
      document.getElementById("hudPie").innerHTML = pieSvg(n, popLast);
    }

    /* ---------- Junebug: the other player picks the 5 targets ---------- */
    function beginPickPhase() {
      state.phase = "selecting";
      state.pickQueue = [];
      const picker = otherPlayer(state.hunter);

      document.getElementById("hudPlayerTag").textContent = `P${picker}`;
      document.getElementById("hudHuntBox").classList.add("hidden");
      document.getElementById("hudPickBox").classList.remove("hidden");
      document.getElementById("clockBox").classList.add("hidden");
      document.getElementById("hudPickText").textContent = `PICK ${TARGETS_PER_ROUND} FOR P${state.hunter}`;

      refreshPickBadges();
      updatePickUI(false);
    }

    function updatePickUI(popLast) {
      const n = state.pickQueue.length;
      const ready = n === TARGETS_PER_ROUND;
      setHudPie(n, popLast);
      const btn = document.getElementById("pickDoneBtn");
      btn.disabled = !ready;
      btn.classList.toggle("opacity-40", !ready);
    }

    function finishTargetSelectionPhase() {
      if (state.pickQueue.length !== TARGETS_PER_ROUND) return;
      state.targetUids = [...state.pickQueue];
      state.boardItems.forEach(it => {
        const b = document.getElementById(`qbadge_${it.uid}`);
        if (b) b.classList.add("hidden");
      });
      showCurtain(`PASS TO P${state.hunter}`, `P${otherPlayer(state.hunter)} picked ${TARGETS_PER_ROUND} for you!`, beginHunt);
    }

    /* ---------- the hunt ---------- */
    function beginHunt() {
      clearActiveTimer();
      state.phase = "hunting";
      state.found = 0;
      state.wrongTapStreak = 0;

      document.getElementById("hudPlayerTag").textContent = `P${state.hunter}`;
      document.getElementById("hudPickBox").classList.add("hidden");
      document.getElementById("hudHuntBox").classList.remove("hidden");
      document.getElementById("clockBox").classList.remove("hidden");
      setHudPie(0, false);

      setTarget(0);

      state.huntStartTs = performance.now();
      updateClockText(0);
      state.timerInterval = setInterval(() => {
        updateClockText(performance.now() - state.huntStartTs);
      }, 80);
      startMoving();
    }

    function updateClockText(ms) {
      document.getElementById("clockText").textContent = fmtTime(ms);
    }

    function setTarget(idx) {
      clearHint();
      state.targetIdx = idx;
      const uid = state.targetUids[idx];
      state.currentTarget = state.boardItems.find(it => it.uid === uid) || null;
      if (state.currentTarget) renderCanonicalHUD(state.currentTarget);
      state.hintTimer = setTimeout(showHint, HINT_MS);
    }

    function renderCanonicalHUD(item) {
      const badge = document.getElementById("hudCanonicalBadge");

      if (item.category === "number" || item.category === "bigram" || item.category === "word") {
        badge.innerHTML = `<span class="text-3xl sm:text-4xl font-black tracking-wider">${item.canonicalText}</span>`;
      } else if (item.category === "polygon") {
        badge.innerHTML = `
          <svg width="40" height="40" viewBox="0 0 100 100" class="shrink-0">
            ${getPolygonInnerMarkup(item.baseShape, item.modifier)}
          </svg>
          <span class="text-lg sm:text-xl font-black uppercase tracking-wide">${item.canonicalText}</span>
        `;
      }
    }

    /* ---------- the hint: a glowing ring instead of a penalty ---------- */
    function showHint() {
      const t = state.currentTarget;
      if (state.phase !== "hunting" || !t || !t.el || t.hintEl) return;
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "hint-ring");
      g.innerHTML = `
        <circle r="${t.hitR + 6}" fill="none" stroke="#2A1B15" stroke-width="15"/>
        <circle r="${t.hitR + 6}" fill="none" stroke="#E5B363" stroke-width="9"/>
      `;
      t.el.appendChild(g);
      t.hintEl = g;
    }

    function clearHint() {
      if (state.hintTimer) { clearTimeout(state.hintTimer); state.hintTimer = null; }
      const t = state.currentTarget;
      if (t && t.hintEl) { t.hintEl.remove(); t.hintEl = null; }
    }

    /********************************************************************
     * 6. TAPS, FINISHING, RESULTS
     ********************************************************************/
    function onItemTapped(item) {
      if (state.phase === "selecting") {
        const idx = state.pickQueue.indexOf(item.uid);
        if (idx !== -1) {
          state.pickQueue.splice(idx, 1);
          refreshPickBadges();
          updatePickUI(false);
        } else if (state.pickQueue.length < TARGETS_PER_ROUND) {
          state.pickQueue.push(item.uid);
          playTone("queue");
          refreshPickBadges();
          updatePickUI(true);
        } else {
          playTone("wrong");   // already picked 5: tap one to un-pick it
        }
        return;
      }

      if (state.phase !== "hunting" || !state.currentTarget) return;

      if (item.uid === state.currentTarget.uid) {
        playTone("find");
        clearHint();
        // pop it off the board
        if (item.el) {
          item.el.style.transition = "opacity .25s";
          item.el.style.opacity = "0";
          item.el.style.pointerEvents = "none";
        }
        spawnSvgRing(item.cx, item.cy, "#38B449", 450);
        state.found++;
        state.wrongTapStreak = 0;
        setHudPie(state.found, true);

        if (state.found >= TARGETS_PER_ROUND) finishLeg();
        else setTarget(state.found);
      } else {
        playTone("wrong");
        spawnSvgRing(item.cx, item.cy, "#C9252D", 300);
        state.wrongTapStreak++;
        if (state.wrongTapStreak >= 3) showHint();   // stuck? help, don't punish
      }
    }

    function refreshPickBadges() {
      state.boardItems.forEach(item => {
        const b = document.getElementById(`qbadge_${item.uid}`);
        const t = document.getElementById(`qtext_${item.uid}`);
        if (!b || !t) return;
        const idx = state.pickQueue.indexOf(item.uid);
        if (idx === -1) {
          b.classList.add("hidden");
        } else {
          t.textContent = String(idx + 1);
          b.classList.remove("hidden");
        }
      });
    }

    function spawnSvgRing(cx, cy, color, durationMs) {
      const fb = document.getElementById("feedbackLayer");
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", String(cx));
      c.setAttribute("cy", String(cy));
      c.setAttribute("r", "34");
      c.setAttribute("fill", "none");
      c.setAttribute("stroke", color);
      c.setAttribute("stroke-width", "7");
      c.setAttribute("class", "beacon-circle");
      fb.appendChild(c);
      if (durationMs) setTimeout(() => c.remove(), durationMs);
      return c;
    }

    function finishLeg() {
      const elapsed = performance.now() - state.huntStartTs;
      clearActiveTimer();
      state.phase = "legDone";
      state.times[state.hunter] = elapsed;
      updateClockText(elapsed);
      playTone("win");

      // big baked pie + your time
      document.getElementById("donePie").innerHTML = pieSvg(TARGETS_PER_ROUND, false);
      document.getElementById("doneTime").textContent = fmtTime(elapsed);
      document.getElementById("doneOverlay").classList.remove("hidden");

      state.flowTimer = setTimeout(() => {
        state.flowTimer = null;
        if (state.leg === 0) {
          const prev = state.hunter;
          state.leg = 1;
          state.hunter = otherPlayer(prev);
          setupLeg(`P${prev} took ${fmtTime(elapsed)}. Beat it!`);
        } else {
          document.getElementById("doneOverlay").classList.add("hidden");
          showSummaryModal();
        }
      }, 1500);
    }

    function showSummaryModal() {
      state.phase = "summary";
      // compare the times the players actually saw (1 decimal)
      const t1 = Math.round(state.times[1] / 100);
      const t2 = Math.round(state.times[2] / 100);
      const winner = t1 === t2 ? 0 : (t1 < t2 ? 1 : 2);
      if (winner === 1) state.p1TotalScore++;
      if (winner === 2) state.p2TotalScore++;

      document.getElementById("summaryTurnTitle").textContent = winner ? `P${winner} WINS!` : "TIE!";
      [1, 2].forEach(p => {
        document.getElementById(`sumP${p}Time`).textContent = fmtTime(state.times[p]);
        document.getElementById(`sumP${p}Wins`).textContent = `WINS: ${p === 1 ? state.p1TotalScore : state.p2TotalScore}`;
        document.getElementById(`sumCell${p}`).classList.toggle("sum-win", winner === p);
      });
      document.getElementById("summaryModal").classList.remove("hidden");
    }

    function advanceFromSummary() {
      document.getElementById("summaryModal").classList.add("hidden");
      state.firstHunter = otherPlayer(state.firstHunter);   // take turns going first
      startRound();
    }

    function returnToLobby() {
      clearActiveTimer();
      state.phase = "lobby";
      document.getElementById("gameScreen").classList.add("hidden");
      document.getElementById("summaryModal").classList.add("hidden");
      document.getElementById("curtainScreen").classList.add("hidden");
      document.getElementById("doneOverlay").classList.add("hidden");
      document.getElementById("lobbyScreen").classList.remove("hidden");
      syncLobbyUI();
    }

    function clearActiveTimer() {
      if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
      if (state.flowTimer) { clearTimeout(state.flowTimer); state.flowTimer = null; }
      clearHint();
      stopMoving();
    }

    let moveRaf = null;
    function startMoving() {
      if (moveRaf || !state.moving) return;
      const W = 800;
      const H = 1050;
      const step = () => {
        if (!state.moving || state.phase !== "hunting") {
          moveRaf = null;
          return;
        }
        state.boardItems.forEach(item => {
          if (item.vx == null && item.vy == null) return;
          item.cx += item.vx;
          item.cy += item.vy;
          const r = (item.hitR || 30) + 4;
          if (item.cx - r < 24) { item.cx = 24 + r; item.vx *= -1; }
          if (item.cx + r > W - 24) { item.cx = W - 24 - r; item.vx *= -1; }
          if (item.cy - r < 24) { item.cy = 24 + r; item.vy *= -1; }
          if (item.cy + r > H - 24) { item.cy = H - 24 - r; item.vy *= -1; }
          if (item.el) item.el.setAttribute("transform", `translate(${Math.round(item.cx)}, ${Math.round(item.cy)})`);
        });
        moveRaf = requestAnimationFrame(step);
      };
      moveRaf = requestAnimationFrame(step);
    }
    function stopMoving() {
      if (moveRaf) { cancelAnimationFrame(moveRaf); moveRaf = null; }
    }

    function unlockHubIframeScroll() {
      try {
        if (window.frameElement) {
          window.frameElement.setAttribute("scrolling", "yes");
          window.frameElement.style.overflow = "auto";
        }
      } catch (e) {}
    }

    window.addEventListener("DOMContentLoaded", () => {
      unlockHubIframeScroll();
      syncLobbyUI();
    });
    window.addEventListener("load", unlockHubIframeScroll);
  </script>
</body>
</html>
