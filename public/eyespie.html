<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Eyes Pie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bungee+Inline&family=Caveat:wght@700&family=Cinzel:wght@700;800&family=Courier+Prime:wght@700&family=DM+Sans:wght@700;800;900&family=Fredoka:wght@600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Special+Elite&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-navy: #24344D;
      --bg-slate: #314766;
      --cream: #EFECE6;
      --pie-gold: #E5B363;
      --pie-crust: #D69847;
      --cherry-red: #C9252D;
      --stem-green: #4BB543;
      --ink-brown: #2A1B15;
      --skin-peach: #F3C69F;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg-navy);
      color: var(--cream);
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Independent scroll container so scrolling works even inside <iframe scrolling="no"> on bubhub.us */
    #lobbyScreen:not(.hidden) {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      display: block;
    }

    #lobbyScreen:not(.hidden) * {
      touch-action: pan-y;
    }


    /* START always visible: pinned to the bottom of the screen */
    #lobbyScreen:not(.hidden) #startBtn {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: max(12px, env(safe-area-inset-bottom));
      width: calc(100% - 24px);
      max-width: 28rem;
      z-index: 40;
      box-shadow: 0 -10px 24px rgba(36,52,77,.95), 0 8px 16px rgba(0,0,0,.4);
    }
    #lobbyScreen:not(.hidden) #startBtn:active { transform: translateX(-50%) translateY(2px); }
    #lobbyScreen:not(.hidden) { padding-bottom: 104px !important; }

    #gameScreen:not(.hidden) {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .paper-sheet {
      background-color: var(--cream);
      box-shadow: 
        0 18px 40px rgba(0, 0, 0, 0.55),
        inset 0 0 24px rgba(43, 29, 22, 0.08);
      border: 3px solid #DFD9CE;
    }

    .svg-item {
      cursor: pointer;
      touch-action: none;
      transition: opacity 0.1s ease;
    }
    .svg-item:active {
      opacity: 0.55;
    }


    /* ---- big, kid-friendly tiles for the lobby ---- */
    .tile {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; line-height: 1.1; font-weight: 900; cursor: pointer;
      border: 3px solid; border-radius: 1rem;
      transition: transform .1s ease;
    }
    .tile:active { transform: scale(.95); }
    .tile-on  { background: var(--pie-gold); color: var(--ink-brown); border-color: var(--pie-crust); box-shadow: 0 3px 0 var(--pie-crust); }
    .tile-off { background: var(--bg-navy); color: rgba(239,236,230,.6); border-color: #435E85; }
    .tile .tick {
      display: none; position: absolute; top: -7px; right: -7px;
      width: 22px; height: 22px; border-radius: 50%;
      align-items: center; justify-content: center;
      background: var(--stem-green); color: #fff; font-size: 13px; font-family: 'DM Sans', sans-serif;
      border: 2px solid var(--bg-slate);
    }
    .tile-on .tick { display: flex; }
    .shake { animation: shake .3s; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    /* ---- pie reward + hint ---- */
    .pie-pop { transform-box: view-box; transform-origin: 50% 50%; animation: piePop .4s ease-out; }
    @keyframes piePop { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
    .done-pop { animation: donePop .55s cubic-bezier(.2, 1.6, .4, 1); }
    @keyframes donePop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .hint-ring { animation: hintPulse .9s ease-in-out infinite; pointer-events: none; }
    @keyframes hintPulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    .sum-win { background: rgba(229,179,99,.18); border-color: var(--pie-gold) !important; }

    @keyframes ringPulse {
      0% { r: 16; opacity: 1; stroke-width: 8; }
      100% { r: 58; opacity: 0; stroke-width: 2; }
    }
    .beacon-circle {
      animation: ringPulse 0.9s ease-out infinite;
    }

    /* ---- my words shelf ---- */
    #shelfScreen:not(.hidden) { -webkit-overflow-scrolling: touch; touch-action: pan-y; }
    #shelfScreen:not(.hidden) * { touch-action: pan-y; }
    .shelf-head { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--pie-gold); margin: 6px 0; }
    .shelf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .shelf-card {
      position: relative; height: 60px; border-radius: 14px;
      background: var(--cream); color: var(--ink-brown); border: 3px solid #DFD9CE;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.1;
    }
    .shelf-berry { border-color: var(--pie-crust); }
    .shelf-stamp { position: absolute; top: -10px; right: -8px; width: 30px; height: 30px; transform: rotate(14deg); filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
    .shelf-dots { display: flex; gap: 4px; margin-top: 3px; }
    .shelf-dots i { display: block; width: 8px; height: 8px; border-radius: 50%; background: #C9B9A6; }
    .shelf-dots i.on { background: var(--cherry-red); }
    .shelf-new {
      height: 40px; border-radius: 12px; border: 2px dashed #435E85; color: rgba(239,236,230,.5);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px;
    }
    .shelf-empty { font-size: 14px; font-weight: 700; color: rgba(239,236,230,.6); padding: 6px 2px 2px; }
  </style>
</head>
<body>

  <!-- ==================== SCREEN 1: ULTRA-MINIMAL LOBBY ==================== -->
  <main id="lobbyScreen" class="p-3 sm:p-5 pb-24">
    <div class="w-full max-w-md mx-auto flex flex-col items-center justify-start gap-3 sm:gap-4 py-2">
      
      <!-- HERO: Custom SVG Replica of Attached Icon + Title ONLY -->
      <div class="flex flex-col items-center gap-1.5 sm:gap-2.5 shrink-0">
        <div class="w-16 h-16 sm:w-24 sm:h-24 rounded-[26%] bg-[#24344D] border-4 border-[#314766] shadow-2xl overflow-hidden flex items-center justify-center relative">
          <svg viewBox="0 0 200 200" class="w-full h-full">
            <!-- Outer Navy Square & Slate Circle -->
            <rect width="200" height="200" rx="44" fill="#24344D"/>
            <circle cx="100" cy="106" r="78" fill="#314766"/>
            
            <!-- Cream Shirt & Shoulders -->
            <path d="M26 200 C30 154 58 144 100 144 C142 144 170 154 174 200 Z" fill="#EFECE6"/>
            <path d="M52 200 C56 172 64 164 68 160" stroke="#D5D0C5" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M148 200 C144 172 136 164 132 160" stroke="#D5D0C5" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            
            <!-- Neck & Collar -->
            <rect x="83" y="130" width="34" height="22" rx="8" fill="#DDA982"/>
            <path d="M74 144 Q100 160 126 144" fill="none" stroke="#D5D0C5" stroke-width="5" stroke-linecap="round"/>

            <!-- Ears -->
            <ellipse cx="49" cy="102" rx="9" ry="14" fill="#F2C6A0"/>
            <ellipse cx="49" cy="102" rx="4.5" ry="8" fill="#DDA982"/>
            <ellipse cx="151" cy="102" rx="9" ry="14" fill="#F2C6A0"/>
            <ellipse cx="151" cy="102" rx="4.5" ry="8" fill="#DDA982"/>

            <!-- Head -->
            <path d="M52 84 C52 50 148 50 148 84 C150 124 132 144 100 144 C68 144 50 124 52 84 Z" fill="#F2C6A0"/>

            <!-- Spiky Dark Brown Hair -->
            <path d="M51 90 C48 70 52 58 55 54 L46 47 L66 46 L62 35 L82 40 L94 24 L100 35 L108 20 L118 39 L140 33 L135 46 L154 49 L144 56 C148 66 150 78 149 90 C146 72 136 62 128 58 C110 64 86 64 70 58 C60 64 54 74 51 90 Z" fill="#2B1D16"/>
            <path d="M76 47 Q90 40 103 44" stroke="#53392D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <path d="M110 44 Q122 40 132 48" stroke="#53392D" stroke-width="2.5" stroke-linecap="round" fill="none"/>

            <!-- Eyebrows -->
            <path d="M60 72 Q76 69 92 75" stroke="#2B1D16" stroke-width="6.5" stroke-linecap="round" fill="none"/>
            <path d="M108 71 Q124 63 138 72" stroke="#2B1D16" stroke-width="6.5" stroke-linecap="round" fill="none"/>

            <!-- Blush Cheeks -->
            <ellipse cx="67" cy="116" rx="10" ry="6" fill="#E59882" opacity="0.75"/>
            <ellipse cx="133" cy="114" rx="10" ry="6" fill="#E59882" opacity="0.75"/>

            <!-- LEFT PIE SLICE EYE -->
            <g transform="translate(76, 95) rotate(-6)">
              <!-- 3D Filling Side -->
              <polygon points="-22,-2 0,18 22,-2 22,5 0,25 -22,5" fill="#D69847"/>
              <polygon points="-21,0 0,20 21,0 21,4 0,24 -21,4" fill="#9E1B22"/>
              <!-- Top Lattice Crust -->
              <path d="M-23,-2 Q0,-18 23,-2 L0,19 Z" fill="#E5B363" stroke="#D69847" stroke-width="1.5"/>
              <!-- Berry Lattice Cutouts -->
              <polygon points="-10,-4 -4,-8 0,-4 -6,0" fill="#9E1B22"/>
              <polygon points="4,-8 10,-4 6,0 0,-4" fill="#9E1B22"/>
              <polygon points="-4,2 0,-1 4,2 0,6" fill="#9E1B22"/>
              <!-- Crust Rim -->
              <path d="M-23,-2 Q0,-17 23,-2" fill="none" stroke="#ECC37E" stroke-width="4" stroke-linecap="round"/>
              <!-- Cherry & Green Stem -->
              <circle cx="0" cy="-2" r="6.5" fill="#C9252D"/>
              <circle cx="-2" cy="-4" r="1.8" fill="#F29B9E"/>
              <path d="M0,-7 Q4,-16 11,-17" fill="none" stroke="#38B449" stroke-width="2.5" stroke-linecap="round"/>
            </g>

            <!-- RIGHT PIE SLICE EYE -->
            <g transform="translate(125, 95) rotate(6)">
              <polygon points="-22,-2 0,18 22,-2 22,5 0,25 -22,5" fill="#D69847"/>
              <polygon points="-21,0 0,20 21,0 21,4 0,24 -21,4" fill="#9E1B22"/>
              <path d="M-23,-2 Q0,-18 23,-2 L0,19 Z" fill="#E5B363" stroke="#D69847" stroke-width="1.5"/>
              <polygon points="-10,-4 -4,-8 0,-4 -6,0" fill="#9E1B22"/>
              <polygon points="4,-8 10,-4 6,0 0,-4" fill="#9E1B22"/>
              <polygon points="-4,2 0,-1 4,2 0,6" fill="#9E1B22"/>
              <path d="M-23,-2 Q0,-17 23,-2" fill="none" stroke="#ECC37E" stroke-width="4" stroke-linecap="round"/>
              <circle cx="0" cy="-2" r="6.5" fill="#C9252D"/>
              <circle cx="-2" cy="-4" r="1.8" fill="#F29B9E"/>
              <path d="M0,-7 Q4,-16 11,-17" fill="none" stroke="#38B449" stroke-width="2.5" stroke-linecap="round"/>
            </g>

            <!-- Nose -->
            <path d="M97 104 C93 114 97 118 105 115" fill="none" stroke="#8C583A" stroke-width="3" stroke-linecap="round"/>

            <!-- Big Toothy Grin -->
            <path d="M76 122 Q102 126 127 116 C124 134 110 140 96 139 C84 138 78 130 76 122 Z" fill="#FFFFFF" stroke="#2B1D16" stroke-width="4" stroke-linejoin="round"/>
            <line x1="91" y1="124" x2="91" y2="137" stroke="#2B1D16" stroke-width="2.8"/>
            <line x1="103" y1="123" x2="103" y2="138" stroke="#2B1D16" stroke-width="2.8"/>
            <line x1="115" y1="120" x2="115" y2="135" stroke="#2B1D16" stroke-width="2.8"/>
          </svg>
        </div>

        <h1 class="text-3xl sm:text-5xl font-bold tracking-wide text-[#EFECE6]" style="font-family: 'Fredoka', sans-serif;">
          EYES <span class="text-[#E5B363]">PIE</span>
        </h1>
      </div>

      <!-- COMPACT LOBBY CARD -->
      <div class="w-full bg-[#314766] border-2 border-[#435E85] rounded-3xl p-3.5 sm:p-5 shadow-2xl space-y-3 shrink-0">

        <!-- Score pill: rounds won -->
        <div class="flex items-center justify-between bg-[#24344D] px-3.5 py-1.5 sm:py-2 rounded-2xl border border-[#435E85]">
          <div class="flex items-center gap-3 text-sm font-extrabold tracking-wide">
            <span class="text-[#E5B363]">P1: <span id="lobbyP1Score">0</span></span>
            <span class="text-[#435E85]">|</span>
            <span class="text-[#F2C6A0]">P2: <span id="lobbyP2Score">0</span></span>
          </div>
          <button onclick="resetMatchScores()" title="Reset Score" class="text-xs font-bold text-[#EFECE6]/70 hover:text-[#EFECE6] px-2 py-0.5 rounded-lg bg-[#314766]">
            ↺
          </button>
        </div>

        <!-- MY WORDS: berry shelf -->
        <button type="button" onclick="openShelf()" class="tile tile-on w-full h-12 text-lg" style="flex-direction:row; gap:10px; font-family:'Fredoka',sans-serif;">
          <span>🫐 MY WORDS</span>
          <span id="shelfCount" class="text-sm font-black bg-[#C9252D] text-[#EFECE6] px-2.5 py-0.5 rounded-full">0</span>
        </button>

        <!-- FIND: what shows up on the board (the tile shows an example) -->
        <div id="findSection" class="space-y-2">
          <div class="text-[11px] font-extrabold uppercase tracking-widest text-[#E5B363]">Find</div>
          <div class="grid grid-cols-4 gap-2.5">
            <button type="button" data-cat="numbers" onclick="toggleCat('numbers')" class="cat-pill tile h-14 text-xl" style="font-family:'Fredoka',sans-serif;">
              <span>42</span><span class="tick">✓</span>
            </button>
            <button type="button" data-cat="words" onclick="toggleCat('words')" class="cat-pill tile h-14 text-xl" style="font-family:'Fredoka',sans-serif;">
              <span>cat</span><span class="tick">✓</span>
            </button>
            <button type="button" data-cat="words4" onclick="toggleCat('words4')" class="cat-pill tile h-14 text-xl" style="font-family:'Fredoka',sans-serif;">
              <span>cake</span><span class="tick">✓</span>
            </button>
            <button type="button" data-cat="words5" onclick="toggleCat('words5')" class="cat-pill tile h-14 text-xl" style="font-family:'Fredoka',sans-serif;">
              <span>night</span><span class="tick">✓</span>
            </button>
          </div>
        </div>

        <!-- CLUE: how the thing to find is shown to the hunter -->
        <div class="space-y-2">
          <div class="text-[11px] font-extrabold uppercase tracking-widest text-[#E5B363]">Clue</div>
          <div class="grid grid-cols-3 gap-2.5">
            <button type="button" id="clueSeeBtn" onclick="setClue('see')" class="tile py-2">
              <span class="text-2xl leading-none">👀</span>
              <span class="text-sm">SEE</span>
              <span class="text-[11px] font-bold opacity-70">read it</span>
            </button>
            <button type="button" id="clueHearBtn" onclick="setClue('hear')" class="tile py-2">
              <span class="text-2xl leading-none">🔊</span>
              <span class="text-sm">HEAR</span>
              <span class="text-[11px] font-bold opacity-70">sounds only</span>
            </button>
            <button type="button" id="clueMathBtn" onclick="setClue('math')" class="tile py-2">
              <span class="text-2xl leading-none">🧮</span>
              <span class="text-sm">MATH</span>
              <span class="text-[11px] font-bold opacity-70">find the answer</span>
            </button>
          </div>
          <div id="mathOpRow" class="hidden">
            <select id="mathOpSelect" onchange="setOp(this.value)" class="w-full h-12 rounded-2xl bg-[#24344D] text-[#EFECE6] border-2 border-[#E5B363] px-3 text-lg font-extrabold" style="font-family:'Fredoka',sans-serif;">
              <option value="add">➕ Addition</option>
              <option value="sub">➖ Subtraction</option>
              <option value="mul">✖️ Multiplication</option>
              <option value="div">➗ Division</option>
            </select>
          </div>
        </div>

        <!-- PLAY: who picks the 5 things -->
        <div class="space-y-2">
          <div class="text-[11px] font-extrabold uppercase tracking-widest text-[#E5B363]">Play</div>
          <div class="grid grid-cols-3 gap-2.5">
            <button type="button" id="modeAutoBtn" onclick="setGameMode('auto')" class="tile py-2">
              <span class="text-2xl leading-none">🎲</span>
              <span class="text-sm">SURPRISE</span>
              <span class="text-[11px] font-bold opacity-70">we pick</span>
            </button>
            <button type="button" id="modeHumanBtn" onclick="setGameMode('junebug')" class="tile py-2">
              <span class="text-2xl leading-none">🐞</span>
              <span class="text-sm">JUNEBUG</span>
              <span class="text-[11px] font-bold opacity-70">friend picks</span>
            </button>
            <button type="button" id="modeSoloBtn" onclick="setGameMode('solo')" class="tile py-2">
              <span class="text-2xl leading-none">🔍</span>
              <span class="text-sm">SOLO</span>
              <span class="text-[11px] font-bold opacity-70">just you</span>
            </button>
          </div>
        </div>

        <!-- HOW MANY -->
        <div class="space-y-2">
          <div class="text-[11px] font-extrabold uppercase tracking-widest text-[#E5B363]">How many</div>
          <div class="grid grid-cols-3 gap-2.5">
            <button type="button" id="densEasyBtn" onclick="setDensity('easy')" class="tile py-2">
              <span class="text-xs leading-none">⭐</span><span class="text-sm">EASY</span>
            </button>
            <button type="button" id="densMedBtn" onclick="setDensity('medium')" class="tile py-2">
              <span class="text-xs leading-none">⭐⭐</span><span class="text-sm">MEDIUM</span>
            </button>
            <button type="button" id="densHardBtn" onclick="setDensity('hard')" class="tile py-2">
              <span class="text-xs leading-none">⭐⭐⭐</span><span class="text-sm">HARD</span>
            </button>
          </div>
        </div>

        <!-- MOVE -->
        <div class="space-y-2">
          <div class="text-[11px] font-extrabold uppercase tracking-widest text-[#E5B363]">Move</div>
          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" id="moveOffBtn" onclick="setMoving(false)" class="tile py-2">
              <span class="text-xl leading-none">😴</span><span class="text-sm">STILL</span>
            </button>
            <button type="button" id="moveOnBtn" onclick="setMoving(true)" class="tile py-2">
              <span class="text-xl leading-none">🌀</span><span class="text-sm">WIGGLE</span>
            </button>
          </div>
        </div>

        <!-- START BUTTON (pinned to bottom of viewport so it is always reachable) -->
        <button id="startBtn" onclick="startMatchFromLobby()" class="w-full py-3.5 sm:py-4 rounded-2xl bg-[#C9252D] hover:bg-[#d92c35] text-[#EFECE6] font-black text-2xl tracking-wider uppercase shadow-lg border-b-4 border-[#8E161C] active:translate-y-0.5 transition">
          PLAY ▶
        </button>

      </div>
    </div>
  </main>

  <!-- ==================== SCREEN 2: MINIMAL PASS OVERLAY ==================== -->
  <section id="curtainScreen" class="hidden fixed inset-0 z-50 bg-[#24344D] flex flex-col items-center justify-center p-6 text-center">
    <div class="max-w-xs w-full bg-[#314766] border-2 border-[#435E85] rounded-3xl p-6 shadow-2xl space-y-5">
      <div id="curtainTitle" class="text-3xl font-black text-[#EFECE6] uppercase tracking-wide">
        PASS TO P1
      </div>
      <div id="curtainSub" class="hidden text-base font-extrabold text-[#E5B363]"></div>
      <button onclick="onCurtainConfirm()" class="w-full py-5 rounded-2xl bg-[#38B449] hover:bg-[#42c754] text-[#2A1B15] font-black text-3xl uppercase tracking-wider shadow-lg border-b-4 border-[#237A30] active:translate-y-0.5 transition">
        GO!
      </button>
    </div>
  </section>

  <!-- ==================== SCREEN 3: ACTIVE GAMEPLAY & SVG JUMBLE ==================== -->
  <section id="gameScreen" class="hidden flex-1 flex flex-col w-full max-w-4xl mx-auto p-1.5 sm:p-3 gap-1.5 sm:gap-2 h-full overflow-hidden">
    
    <!-- HUD: row 1 = back, who + pie, clock.  Row 2 = what to find (full width, never cut off) -->
    <header class="bg-[#314766] border-2 border-[#435E85] rounded-2xl px-2.5 py-1.5 flex flex-wrap items-center justify-between gap-x-2 gap-y-1.5 shrink-0 shadow-lg">

      <div class="flex items-center gap-1.5">
        <button onclick="returnToLobby()" class="w-11 h-11 rounded-xl bg-[#24344D] text-[#EFECE6] text-lg font-black flex items-center justify-center border border-[#435E85] active:scale-95 transition">
          ✕
        </button>
        <div class="bg-[#24344D] pl-2.5 pr-1.5 py-0.5 rounded-xl border border-[#435E85] flex items-center gap-1.5">
          <span id="hudPlayerTag" class="text-sm font-black text-[#E5B363]">P1</span>
          <span id="hudPie" class="block w-10 h-10"></span>
        </div>
      </div>

      <div class="order-last w-full sm:order-none sm:w-auto sm:flex-1 flex items-center justify-center min-w-0">
        <!-- Hunt target -->
        <div id="hudHuntBox" class="bg-[#EFECE6] text-[#2A1B15] px-4 py-1 rounded-xl border-2 border-[#D69847] min-h-[52px] flex items-center justify-center gap-2 shadow-inner max-w-full">
          <div id="hudCanonicalBadge" class="font-black flex flex-wrap items-center justify-center gap-x-2 text-center"></div>
        </div>

        <!-- Junebug: pick 5 -->

  <!-- ==================== JAVASCRIPT ENGINE ==================== -->
  <script>
    /********************************************************************
     * 1. KID-FRIENDLY POOLS & DATA
     ********************************************************************/
    // Look-alike words. Every word on the board has "near-misses" to be confused with
    // (cat / cap / cut / car / can). Only words with at least two one-letter-off
    // neighbours in their list are kept, so there are always look-alikes to pair up.
    const RAW_WORDS_3 = `
      cat cap can car cab cut cup cot cub bat bag bad ban bar bed big bit bin bog box bud bug bun bus but
      hat ham had hen him hip his hit hog hop hot hub hug hum hut pan pad pal paw pet peg pen pig pin pit
      pod pop pot pup dad den dig dim dip dog dot dug fan fat fed fig fin fit fox fun gap gas gum gun jam
      jar jet jig job jog jug lap leg let lid lip lit log lot mad man map mat men met mix mob mop mud mug
      nap net nod nut rag ram ran rat red rib rid rim rip rob rod rot rub rug run sad sat saw set sip sit
      six sob sub sum sun tab tag tan tap ten tin tip top toy tub tug van vet wag wax web wet wig win zip
      zap bib kid kit nip sap sag yes yet`;

    const RAW_WORDS_4 = `
      bake cake lake make rake take wake cave gave wave save came game name same tame fame cane lane mane
      pane bone cone tone dime lime time fine line mine nine pine vine wine dine bike hike five dive hive
      fire hire tire wire hole mole pole sole role home dome hose nose rose pose cube tube cute mute tune
      dune rule mule kite bite site dice mice nice rice face lace race pace cage page wage rage back pack
      sack tack rack lack jack bell fell sell tell well yell ball call fall hall tall wall bill fill hill
      mill pill will hand band land sand bank sank tank rank ring sing king wing duck luck buck sock rock
      lock dock deck neck peck bump jump lump pump dump camp lamp damp ramp best nest rest test vest west
      fist list mist fast last mast past cast mask task bend mend send tend bent dent rent sent tent vent
      went belt melt felt gift lift fish dish wish beat heat meat neat seat boat coat goat moat book cook
      hook look took moon noon soon rain gain main pain tail bail fail hail jail mail nail pail rail sail
      boot foot root food good hood mood wood deer seed need feed weed keep deep peep fork cork pork corn
      horn born torn bear pear gear year fear hear near dear flag flat flip slip slap clap clip chip ship
      shop chop drop crop slow snow blow glow flow grow crow show`;

    const RAW_WORDS_5 = `
      house mouse horse nurse purse curse worse paint faint saint point joint plant plane plate brush
      crush blush flush plush brick trick click clock block flock black beach peach reach teach bread
      break dread tread light night right sight tight fight might stone store shore score snore stove
      sheep sheet sleep sweep steep whale while white whole grape grade grace graze brave grave shave
      crown brown drown frown grown tower power lower mower bunny funny sunny berry merry ferry candy
      handy sandy dandy share shape shade shake shame shark snake stake skate slate state crane crate
      grate`;

    function parseWordList(raw) { return [...new Set(raw.trim().split(/\s+/).map(w => w.toUpperCase()))]; }
    function isOneOff(a, b) {
      if (a.length !== b.length) return false;
      let diff = 0;
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i] && ++diff > 1) return false;
      return diff === 1;
    }
    function keepConnected(list) { return list.filter(w => list.filter(x => isOneOff(w, x)).length >= 2); }

    const WORDS_3 = keepConnected(parseWordList(RAW_WORDS_3));
    const WORDS_4 = keepConnected(parseWordList(RAW_WORDS_4));
    const WORDS_5 = keepConnected(parseWordList(RAW_WORDS_5));
    const ALL_WORDS = [...WORDS_3, ...WORDS_4, ...WORDS_5].sort();

    // Cut a word list into families of look-alikes (a seed word + words one letter off it),
    // preferring words that change the same letter (cat / cap / can / car).
    const FAMILY_SIZE = 5;
    function lookAlikeFamilies(list) {
      const used = new Set();
      const families = [];
      for (const seed of shuffleArray(list)) {
        if (used.has(seed)) continue;
        const mates = list.filter(w => !used.has(w) && isOneOff(seed, w));
        if (mates.length < 2) continue;
        const byPos = {};
        mates.forEach(m => {
          let p = 0;
          while (seed[p] === m[p]) p++;
          (byPos[p] = byPos[p] || []).push(m);
        });
        const picked = [];
        Object.values(byPos).sort((a, b) => b.length - a.length).forEach(group => {
          shuffleArray(group).forEach(m => { if (picked.length < FAMILY_SIZE - 1) picked.push(m); });
        });
        const family = [seed, ...picked];
        family.forEach(w => used.add(w));
        families.push(family);
      }
      return families;
    }

        const AMBIGUOUS_NUMBERS = new Set([6, 9, 66, 68, 69, 86, 89, 96, 98, 99]);

    const FONT_STYLES = [
      { family: "'DM Sans', sans-serif", weight: "800", style: "normal", outline: false },
      { family: "'Libre Baskerville', serif", weight: "700", style: "normal", outline: false },
      { family: "'Playfair Display', serif", weight: "800", style: "normal", outline: false },
      { family: "'Abril Fatface', cursive", weight: "400", style: "normal", outline: false },
      { family: "'Courier Prime', monospace", weight: "700", style: "normal", outline: false },
      { family: "'Cinzel', serif", weight: "800", style: "normal", outline: false },
      { family: "'Fredoka', sans-serif", weight: "700", style: "normal", outline: false },
      { family: "'Fredoka', sans-serif", weight: "700", style: "normal", outline: true }
    ];

    /* ---------- MATH clues: the clue is an equation, the thing to find is its answer ---------- */
    const MATH_SYMBOLS = { add: "+", sub: "−", mul: "×", div: "÷" };
    function mathRange() { return state.densityKey === "easy" ? 20 : state.densityKey === "medium" ? 50 : 99; }
    // every kid-sized [a, b] where a (op) b = n
    function mathPairs(op, n) {
      const out = [];
      if (op === "add") {
        for (let a = 1; a <= n - 1; a++) out.push([a, n - a]);
      } else if (op === "sub") {
        for (let b = 1; b <= 9; b++) out.push([n + b, b]);
      } else if (op === "mul") {
        for (let a = 2; a <= 10; a++) if (n % a === 0 && n / a >= 2 && n / a <= 10) out.push([a, n / a]);
      } else if (op === "div") {
        // Easy keeps the dividend small (at most 50) and divides by 2 to 5 only
        const easy = state.densityKey === "easy";
        const maxB = easy ? 5 : 10, cap = easy ? 50 : 100;
        for (let b = 2; b <= maxB; b++) if (n * b <= cap) out.push([n * b, b]);
      }
      return out;
    }
    function makeEquation(op, n) {
      const pairs = mathPairs(op, n);
      const [a, b] = pairs[Math.floor(Math.random() * pairs.length)];
      return `${a} ${MATH_SYMBOLS[op]} ${b} = ?`;
    }

    /* ---------- HEAR clues: the word is spoken, never shown ---------- */
    const SPEECH_OK = typeof window !== "undefined" && "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
    // Set this to a folder (for example "sounds/") to play recorded files like sounds/cat.mp3.
    // Any word without a file falls back to the device voice. Leave "" to use the device voice only.
    const AUDIO_FOLDER = "";
    const CAN_SPEAK = SPEECH_OK || !!AUDIO_FOLDER;
    let clueAudio = null;

    // Prefer the nicest English voice the device has (natural / neural / enhanced), never the compact robot ones
    function pickVoice() {
      try {
        const all = window.speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
        const good = all.filter(v => !/compact|espeak/i.test(v.name));
        const pool = good.length ? good : all;
        const prefs = [/natural|neural/i, /premium|enhanced/i, /google (us|uk) english/i, /samantha|ava|allison|aria|jenny|zoe|karen/i];
        for (const re of prefs) { const v = pool.find(x => re.test(x.name)); if (v) return v; }
        return pool.find(v => /en[-_]US/i.test(v.lang)) || pool[0] || null;
      } catch (e) { return null; }
    }
    function speakSynth(word) {
      if (!SPEECH_OK) return;
      try {
        const synth = window.speechSynthesis;
        if (synth.speaking || synth.pending) synth.cancel();
        const u = new SpeechSynthesisUtterance(word.toLowerCase());
        const v = pickVoice();
        if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = "en-US"; }
        u.rate = 0.85;
        u.pitch = 1;
        synth.speak(u);
      } catch (e) {}
    }
    function speakWord(word) {
      if (AUDIO_FOLDER) {
        try {
          if (clueAudio) clueAudio.pause();
          if (SPEECH_OK && window.speechSynthesis.speaking) window.speechSynthesis.cancel();
          const a = new Audio(`${AUDIO_FOLDER}${word.toLowerCase()}.mp3`);
          clueAudio = a;
          a.onerror = () => speakSynth(word);
          const pr = a.play();
          if (pr && pr.catch) pr.catch(() => speakSynth(word));
          return;
        } catch (e) {}
      }
      speakSynth(word);
    }
    function stopSpeaking() {
      if (state.speakTimer) { clearTimeout(state.speakTimer); state.speakTimer = null; }
      try { if (clueAudio) clueAudio.pause(); } catch (e) {}
      try { if (SPEECH_OK) window.speechSynthesis.cancel(); } catch (e) {}
    }
    function speakClue(delayMs) {
      const t = state.currentTarget;
      if (!t || !CAN_SPEAK) return;
      if (state.speakTimer) { clearTimeout(state.speakTimer); state.speakTimer = null; }
      const go = () => { state.speakTimer = null; speakWord(t.canonicalText); };
      if (delayMs) state.speakTimer = setTimeout(go, delayMs);
      else go();
    }

    /* ---------- MY WORDS shelf: 3 finds = a berry stamp (saved on this device only) ---------- */
    const SHELF_KEY = "eyespie_my_words_v1";
    const BERRY_AT = 3;
    let shelfMemory = {};
    let berryToastTimer = null;

    function loadShelf() {
      try {
        const raw = localStorage.getItem(SHELF_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        shelfMemory = parsed && typeof parsed === "object" ? parsed : {};
      } catch (e) { shelfMemory = {}; }
    }
    function saveShelf() {
      try { localStorage.setItem(SHELF_KEY, JSON.stringify(shelfMemory)); } catch (e) {}
    }
    function shelfBerryCount() {
      return ALL_WORDS.filter(w => (shelfMemory[w] || 0) >= BERRY_AT).length;
    }
    function berryStampSvg() {
      return `<svg viewBox="0 0 40 40" class="w-full h-full">
        <path d="M20 12 Q22 4 31 4 Q29 11 20 12 Z" fill="#4BB543"/>
        <circle cx="20" cy="25" r="13" fill="#C9252D" stroke="#9E1B22" stroke-width="2"/>
        <circle cx="15" cy="20" r="3.4" fill="#F29B9E"/>
        <circle cx="25" cy="29" r="1.6" fill="#9E1B22"/><circle cx="19" cy="31" r="1.6" fill="#9E1B22"/><circle cx="27" cy="22" r="1.6" fill="#9E1B22"/>
      </svg>`;
    }
    function noteWordFound(word) {
      const before = shelfMemory[word] || 0;
      shelfMemory[word] = before + 1;
      saveShelf();
      if (before < BERRY_AT && before + 1 >= BERRY_AT) showBerryToast(word);
    }
    function showBerryToast(word) {
      const toast = document.getElementById("berryToast");
      document.getElementById("berryToastIcon").innerHTML = berryStampSvg();
      document.getElementById("berryToastText").textContent = `BERRY WORD! ${word.toLowerCase()}`;
      toast.classList.remove("hidden");
      if (berryToastTimer) clearTimeout(berryToastTimer);
      berryToastTimer = setTimeout(() => { toast.classList.add("hidden"); berryToastTimer = null; }, 1700);
    }

    function renderShelf() {
      const berry = [], practice = [], fresh = [];
      ALL_WORDS.forEach(w => {
        const n = shelfMemory[w] || 0;
        (n >= BERRY_AT ? berry : n > 0 ? practice : fresh).push(w);
      });
      document.getElementById("shelfSummary").textContent = `🫐 ${berry.length}`;

      const cardBerry = w => `<div class="shelf-card shelf-berry"><span>${w.toLowerCase()}</span><span class="shelf-stamp">${berryStampSvg()}</span></div>`;
      const cardPractice = w => {
        const n = shelfMemory[w] || 0;
        let dots = "";
        for (let i = 0; i < BERRY_AT; i++) dots += `<i class="${i < n ? "on" : ""}"></i>`;
        return `<div class="shelf-card"><span>${w.toLowerCase()}</span><span class="shelf-dots">${dots}</span></div>`;
      };

      let html = `<div><div class="shelf-head">Berry words · ${berry.length}</div>`;
      html += berry.length
        ? `<div class="shelf-grid">${berry.map(cardBerry).join("")}</div>`
        : `<div class="shelf-empty">Find a word ${BERRY_AT} times to earn its berry stamp!</div>`;
      html += `</div>`;

      if (practice.length) {
        html += `<div><div class="shelf-head">Practicing · ${practice.length}</div><div class="shelf-grid">${practice.map(cardPractice).join("")}</div></div>`;
      }

      html += `<details class="pb-6"><summary class="shelf-head cursor-pointer" style="list-style:none;">▸ New words · ${fresh.length}</summary>
        <div class="grid grid-cols-4 gap-2 mt-2">${fresh.map(w => `<div class="shelf-new">${w.toLowerCase()}</div>`).join("")}</div></details>`;

      document.getElementById("shelfBody").innerHTML = html;
    }
    function openShelf() {
      renderShelf();
      const s = document.getElementById("shelfScreen");
      s.classList.remove("hidden");
      s.scrollTop = 0;
    }
    function closeShelf() {
      document.getElementById("shelfScreen").classList.add("hidden");
    }
    loadShelf();

    /********************************************************************
     * 2. WEB AUDIO SYNTH
     ********************************************************************/
    let audioCtx = null;
    function playTone(type) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx && AudioContextClass) audioCtx = new AudioContextClass();
        if (!audioCtx) return;
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === "win") {
          [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = "triangle";
            o.frequency.setValueAtTime(f, now + i * 0.11);
            g.gain.setValueAtTime(0.0001, now + i * 0.11);
            g.gain.exponentialRampToValueAtTime(0.2, now + i * 0.11 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.3);
            o.start(now + i * 0.11);
            o.stop(now + i * 0.11 + 0.32);
          });
          return;
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "find") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(783.99, now + 0.06);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === "wrong") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.linearRampToValueAtTime(110, now + 0.12);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
          osc.start(now);
          osc.stop(now + 0.13);
        } else if (type === "queue") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(660, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === "timesup") {
          osc.type = "square";
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(280, now + 0.15);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        }
      } catch (e) {}
    }

    /********************************************************************
     * 3. STATE & LOBBY CONTROLS
     ********************************************************************/
    const TARGETS_PER_ROUND = 5;   // a pie has 5 slices: find 5 things to bake it
    const HINT_MS = 8000;          // no find for this long -> the target glows

    // Easy = few, BIG, mostly upright. Medium/Hard = the original crowded boards.
    const DENSITY = {
      easy:   { count: 18,  min: 56, max: 84, rotRange: 28 },
      medium: { count: 48,  min: 32, max: 60, rotRange: 180 },
      hard:   { count: 120, min: 32, max: 60, rotRange: 180 }
    };

    const state = {
      p1TotalScore: 0,   // rounds won
      p2TotalScore: 0,
      firstHunter: 1,    // alternates every round
      hunter: 1,         // who is hunting right now
      leg: 0,            // 0 = first hunter, 1 = second hunter
      times: { 1: null, 2: null },
      phase: "lobby",
      nextCurtainAction: null,

      categories: {
        numbers: true,
        words: true,
        words4: false,
        words5: false
      },
      clue: "see",         // 'see' (read it) | 'hear' (spoken word only) | 'math' (equation -> its answer)
      op: "add",           // math clue: 'add' | 'sub' | 'mul' | 'div'
      mode: "auto",        // 'auto' (surprise) | 'junebug' (friend picks) | 'solo'
      densityKey: "easy",
      moving: false,

      boardItems: [],
      targetUids: [],      // the 5 things to find, in order
      pickQueue: [],       // junebug: what the picker has tapped so far
      targetIdx: 0,
      found: 0,
      currentTarget: null,

      timerInterval: null,
      flowTimer: null,
      hintTimer: null,
      speakTimer: null,
      huntStartTs: 0,
      wrongTapStreak: 0
    };

    function otherPlayer(n) { return n === 1 ? 2 : 1; }
    function fmtTime(ms) { return (ms / 1000).toFixed(1) + "s"; }

    function paint(el, on) {
      el.classList.toggle("tile-on", !!on);
      el.classList.toggle("tile-off", !on);
    }

    function syncLobbyUI() {
      document.querySelectorAll(".cat-pill").forEach(btn => paint(btn, state.categories[btn.dataset.cat]));

      paint(document.getElementById("clueSeeBtn"), state.clue === "see");
      paint(document.getElementById("clueHearBtn"), state.clue === "hear");
      paint(document.getElementById("clueMathBtn"), state.clue === "math");
      document.getElementById("findSection").classList.toggle("hidden", state.clue === "math");
      document.getElementById("mathOpRow").classList.toggle("hidden", state.clue !== "math");
      document.getElementById("mathOpSelect").value = state.op;
      const numTile = document.querySelector('.cat-pill[data-cat="numbers"]');
      numTile.classList.toggle("opacity-30", state.clue === "hear");          // HEAR is words only
      numTile.classList.toggle("pointer-events-none", state.clue === "hear");

      paint(document.getElementById("modeAutoBtn"), state.mode === "auto");
      paint(document.getElementById("modeHumanBtn"), state.mode === "junebug");
      paint(document.getElementById("modeSoloBtn"), state.mode === "solo");

      paint(document.getElementById("densEasyBtn"), state.densityKey === "easy");
      paint(document.getElementById("densMedBtn"), state.densityKey === "medium");
      paint(document.getElementById("densHardBtn"), state.densityKey === "hard");

      paint(document.getElementById("moveOffBtn"), !state.moving);
      paint(document.getElementById("moveOnBtn"), state.moving);

      document.getElementById("lobbyP1Score").textContent = state.p1TotalScore;
      document.getElementById("lobbyP2Score").textContent = state.p2TotalScore;
      document.getElementById("shelfCount").textContent = shelfBerryCount();
    }

    function toggleCat(key) {
      // in HEAR only the word tiles count; otherwise numbers count too
      const relevant = state.clue === "hear" ? ["words", "words4", "words5"] : ["numbers", "words", "words4", "words5"];
      const activeCount = relevant.filter(k => state.categories[k]).length;
      if (state.categories[key] && activeCount <= 1) {
        // Need at least one thing to find: wiggle the button so it doesn't feel broken
        const btn = document.querySelector(`.cat-pill[data-cat="${key}"]`);
        if (btn) {
          btn.classList.add("shake");
          setTimeout(() => btn.classList.remove("shake"), 320);
        }
        return;
      }
      state.categories[key] = !state.categories[key];
      syncLobbyUI();
    }

    function setClue(c) {
      state.clue = c;
      // HEAR needs at least one kind of word switched on
      if (c === "hear" && !["words", "words4", "words5"].some(k => state.categories[k])) state.categories.words = true;
      syncLobbyUI();
    }
    function setOp(o) { state.op = o; syncLobbyUI(); }
    function setGameMode(m) { state.mode = m; syncLobbyUI(); }
    function setDensity(d) { state.densityKey = d; syncLobbyUI(); }
    function setMoving(m) { state.moving = m; syncLobbyUI(); }

    function resetMatchScores() {
      state.p1TotalScore = 0;
      state.p2TotalScore = 0;
      state.firstHunter = 1;
      syncLobbyUI();
    }

    /********************************************************************
     * 4. SVG JUMBLE GENERATOR
     ********************************************************************/
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildCandidatePool(targetCount) {
      const pools = [];

      if (state.clue === "math") {
        // numbers only; each one carries an equation whose answer it is
        const list = [];
        for (let n = 1; n <= mathRange(); n++) {
          if (!mathPairs(state.op, n).length) continue;
          list.push({
            uid: `num_${n}`,
            category: "number",
            canonicalText: String(n),
            boardText: String(n),
            underline: AMBIGUOUS_NUMBERS.has(n),
            clueText: makeEquation(state.op, n)
          });
        }
        pools.push(shuffleArray(list));
      } else {
        if (state.clue === "see" && state.categories.numbers) {
          const list = [];
          for (let n = 1; n <= 99; n++) {
            list.push({
              uid: `num_${n}`,
              category: "number",
              canonicalText: String(n),
              boardText: String(n),
              underline: AMBIGUOUS_NUMBERS.has(n)
            });
          }
          pools.push(shuffleArray(list));
        }

        const WORD_SETS = [
          { cat: "words",  list: WORDS_3 },
          { cat: "words4", list: WORDS_4 },
          { cat: "words5", list: WORDS_5 }
        ];
        for (const set of WORD_SETS) {
          if (!state.categories[set.cat]) continue;
          pools.push(wordPoolFromFamilies(set.list));
        }
        if (!pools.length) pools.push(wordPoolFromFamilies(WORDS_3));
      }

      const selected = [];
      let idx = 0;
      while (selected.length < targetCount) {
        let added = false;
        for (const p of pools) {
          if (idx < p.length && selected.length < targetCount) {
            selected.push(p[idx]);
            added = true;
          }
        }
        if (!added) break;
        idx++;
      }

      return shuffleArray(selected);
    }

    // Look-alike families laid end to end, so a board gets whole families (cat, cap, cut, car, can...)
    function wordPoolFromFamilies(list) {
      const out = [];
      lookAlikeFamilies(list).forEach(family => {
        family.forEach(w => {
          const r = Math.random();
          const txt = r < 0.35 ? w.toLowerCase() : (r < 0.7 ? w[0] + w.slice(1).toLowerCase() : w);
          out.push({
            uid: `word_${w}`,
            category: "word",
            canonicalText: w,
            boardText: txt,
            underline: true
          });
        });
      });
      return out;
    }

    function buildVisualItemGroup(item, sizeOverride) {
      const ns = "http://www.w3.org/2000/svg";
      const sz = sizeOverride || item.size;
      const g = document.createElementNS(ns, "g");
      g.setAttribute("transform", `rotate(${item.rot}) scale(${item.sx}, ${item.sy})`);

      if (item.category === "number" || item.category === "word") {
        const textEl = document.createElementNS(ns, "text");
        textEl.setAttribute("x", "0");
        textEl.setAttribute("y", "0");
        textEl.setAttribute("text-anchor", "middle");
        textEl.setAttribute("dominant-baseline", "central");
        textEl.setAttribute("font-family", item.fontSpec.family);
        textEl.setAttribute("font-weight", item.fontSpec.weight);
        textEl.setAttribute("font-style", item.fontSpec.style);
        textEl.setAttribute("font-size", String(sz));

        if (item.fontSpec.outline) {
          textEl.setAttribute("fill", "#EFECE6");
          textEl.setAttribute("stroke", "#2A1B15");
          textEl.setAttribute("stroke-width", "3");
        } else {
          textEl.setAttribute("fill", "#2A1B15");
        }

        textEl.textContent = item.boardText;
        g.appendChild(textEl);

        if (item.underline) {
          const line = document.createElementNS(ns, "line");
          const halfW = sz * 0.44;
          const yOff = sz * 0.50;
          line.setAttribute("x1", String(-halfW));
          line.setAttribute("y1", String(yOff));
          line.setAttribute("x2", String(halfW));
          line.setAttribute("y2", String(yOff));
          line.setAttribute("stroke", "#2A1B15");
          line.setAttribute("stroke-width", "4");
          line.setAttribute("stroke-linecap", "round");
          g.appendChild(line);
        }
      }

      return g;
    }

    function measureRotatedItemBounds(item, curSize, layer) {
      const ns = "http://www.w3.org/2000/svg";
      const wrapper = document.createElementNS(ns, "g");
      const visualG = buildVisualItemGroup(item, curSize);
      wrapper.appendChild(visualG);
      layer.appendChild(wrapper);

      let bw = 0, bh = 0;
      try {
        const b = wrapper.getBBox();
        bw = b.width;
        bh = b.height;
      } catch (e) {}
      wrapper.remove();

      let charW = 1.05;
      if (item.category === "number") charW = item.boardText.length === 1 ? 0.82 : 1.38;
      else if (item.category === "word") charW = item.canonicalText.length <= 3 ? 2.25 : 0.64 * item.canonicalText.length;

      const rawW = curSize * charW * item.sx;
      const rawH = curSize * 1.02 * item.sy;
      const rad = (item.rot * Math.PI) / 180;
      const cos = Math.abs(Math.cos(rad));
      const sin = Math.abs(Math.sin(rad));
      const estW = rawW * cos + rawH * sin;
      const estH = rawW * sin + rawH * cos;

      const finalW = Math.max(bw, estW);
      const finalH = Math.max(bh, estH);

      return {
        halfW: finalW / 2,
        halfH: finalH / 2
      };
    }

    function generateAndRenderSvgJumble() {
      const cfg = DENSITY[state.densityKey] || DENSITY.easy;
      const candidates = buildCandidatePool(cfg.count);
      const count = candidates.length;

      document.getElementById("jumbleLayer").innerHTML = "";
      document.getElementById("feedbackLayer").innerHTML = "";

      const rawItems = candidates.map((item, idx) => {
        const minAllowed = cfg.min;
        const maxAllowed = cfg.max;

        // a few big ones, a bunch of medium ones, the rest small (within this density's range)
        const ratio = idx / count;
        const t = ratio < 0.16 ? 0.85 + Math.random() * 0.15
                : ratio < 0.55 ? 0.40 + Math.random() * 0.30
                : Math.random() * 0.25;
        const size = Math.round(minAllowed + (maxAllowed - minAllowed) * t);

        const velocity = state.moving ? { vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8 } : {};

        return {
          ...item,
          size,
          ...velocity,
          minSize: minAllowed,
          fontSpec: FONT_STYLES[Math.floor(Math.random() * FONT_STYLES.length)],
          rot: Math.round((Math.random() * 2 - 1) * cfg.rotRange),
          sx: +(0.94 + Math.random() * 0.14).toFixed(2),
          sy: +(0.94 + Math.random() * 0.14).toFixed(2)
        };
      });

      state.boardItems = placeItems(rawItems);
      renderSvgItemsToDOM();
    }

    // Scatter items on the 800x1050 sheet without overlaps. Returns the ones that fit.
     function placeItems(rawItems) {
       const W = 800;
       const H = 1050;
       const layer = document.getElementById("jumbleLayer");
       const cfg = DENSITY[state.densityKey] || DENSITY.easy;
       const ordered = [...rawItems].sort((a, b) => b.size - a.size);

      const placedBoxes = [];
      const placedItems = [];
      const outerMargin = 24;
      const safetyPad = 8;

      for (const item of ordered) {
        let curSize = item.size;
        let placed = false;

        while (curSize >= item.minSize && !placed) {
          const { halfW, halfH } = measureRotatedItemBounds(item, curSize, layer);
          const rx = halfW + safetyPad;
          const ry = halfH + safetyPad;

          const minX = outerMargin + halfW;
          const maxX = W - outerMargin - halfW;
          const minY = outerMargin + halfH;
          const maxY = H - outerMargin - halfH;

          if (minX < maxX && minY < maxY) {
            for (let attempt = 0; attempt < 260; attempt++) {
              const cx = minX + Math.random() * (maxX - minX);
              const cy = minY + Math.random() * (maxY - minY);

              let hit = false;
               for (let i = 0; i < placedBoxes.length; i++) {
                 const b = placedBoxes[i];
                 if (Math.abs(cx - b.cx) < (rx + b.halfW) && Math.abs(cy - b.cy) < (ry + b.halfH)) {
                   hit = true;
                   break;
                 }
               }

              if (!hit) {
                item.size = Math.round(curSize);
                item.cx = Math.round(cx);
                item.cy = Math.round(cy);
                item.hitR = Math.max(28, Math.round(Math.max(halfW, halfH) + 6));
                placedBoxes.push({ cx, cy, halfW, halfH });
                placedItems.push(item);
                placed = true;
                break;
              }
            }
          }

          if (!placed) {
            if (curSize === item.minSize) break;
            curSize = Math.max(item.minSize, curSize - 4);
          }
        }
      }
      return placedItems;
    }

    // Second player gets the SAME things, scattered in NEW spots (so watching the first player doesn't help)
    function relayoutSameItems() {
      const base = state.boardItems;
      for (let attempt = 0; attempt < 12; attempt++) {
        const clones = base.map(({ el, hintEl, ...rest }) => ({ ...rest }));
        const placed = placeItems(clones);
        if (placed.length === base.length) {
          state.boardItems = placed;
          break;
        }
      }
      renderSvgItemsToDOM();
    }

    function renderSvgItemsToDOM() {
      const layer = document.getElementById("jumbleLayer");
      const fbLayer = document.getElementById("feedbackLayer");
      layer.innerHTML = "";
      fbLayer.innerHTML = "";

      const ns = "http://www.w3.org/2000/svg";

      state.boardItems.forEach(item => {
        const g = document.createElementNS(ns, "g");
        g.setAttribute("class", "svg-item");
        g.setAttribute("transform", `translate(${item.cx}, ${item.cy})`);
        item.el = g;

        const hitCircle = document.createElementNS(ns, "circle");
        hitCircle.setAttribute("cx", "0");
        hitCircle.setAttribute("cy", "0");
        hitCircle.setAttribute("r", String(item.hitR));
        hitCircle.setAttribute("fill", "transparent");
        g.appendChild(hitCircle);

        const visualG = buildVisualItemGroup(item, item.size);
        g.appendChild(visualG);

        const badgeG = document.createElementNS(ns, "g");
        badgeG.setAttribute("id", `qbadge_${item.uid}`);
        badgeG.setAttribute("class", "hidden");
        badgeG.innerHTML = `
          <circle cx="0" cy="0" r="24" fill="#C9252D" stroke="#EFECE6" stroke-width="3.5"/>
          <text id="qtext_${item.uid}" x="0" y="1" text-anchor="middle" dominant-baseline="central" fill="#EFECE6" font-weight="900" font-size="22">1</text>
        `;
        g.appendChild(badgeG);

        g.addEventListener("pointerdown", (e) => {
          e.stopPropagation();
          onItemTapped(item, g);
        });

        layer.appendChild(g);
      });
    }

    /********************************************************************
     * 5. ROUND FLOW
     *    A round = two hunts on the same 5 targets. Lowest time wins.
     *    Surprise: 5 random targets.  Junebug: your friend picks the 5.
     ********************************************************************/
    function startMatchFromLobby() {
      document.getElementById("lobbyScreen").classList.add("hidden");
      document.getElementById("summaryModal").classList.add("hidden");
      document.getElementById("curtainScreen").classList.add("hidden");
      document.getElementById("doneOverlay").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
      startRound();
    }

     function startRound() {
       clearActiveTimer();
       if (state.mode === "solo") {
         beginSoloHunt();
         return;
       }
       state.times = { 1: null, 2: null };
       state.leg = 0;
       state.hunter = state.firstHunter;
       setupLeg();
     }

    function setupLeg(curtainSub) {
      clearActiveTimer();
      document.getElementById("doneOverlay").classList.add("hidden");

      if (state.mode === "junebug") {
        // fresh board every leg; the other player picks 5 things for the hunter
        generateAndRenderSvgJumble();
        beginPickPhase();
        return;
      }

      if (state.leg === 0) {
        generateAndRenderSvgJumble();
        state.targetUids = shuffleArray(state.boardItems).slice(0, TARGETS_PER_ROUND).map(it => it.uid);
        showCurtain(`P${state.hunter} READY?`, `Find ${TARGETS_PER_ROUND}!`, beginHunt);
      } else {
        relayoutSameItems();
        showCurtain(`PASS TO P${state.hunter}`, curtainSub, beginHunt);
      }
    }

    function showCurtain(titleText, subText, callback) {
      clearActiveTimer();
      state.phase = "curtain";
      state.nextCurtainAction = callback;
      document.getElementById("curtainTitle").textContent = titleText;
      const sub = document.getElementById("curtainSub");
      sub.textContent = subText || "";
      sub.classList.toggle("hidden", !subText);
      document.getElementById("curtainScreen").classList.remove("hidden");
    }

    function onCurtainConfirm() {
      document.getElementById("curtainScreen").classList.add("hidden");
      if (state.nextCurtainAction) state.nextCurtainAction();
    }

    /* ---------- the pie (progress + reward) ---------- */
    function pieSvg(n, popLast) {
      const total = TARGETS_PER_ROUND;
      const cx = 50, cy = 50, r = 44;
      let out = "";
      for (let i = 0; i < total; i++) {
        const a1 = (-90 + (i * 360) / total) * Math.PI / 180;
        const a2 = (-90 + ((i + 1) * 360) / total) * Math.PI / 180;
        const x1 = (cx + r * Math.cos(a1)).toFixed(1), y1 = (cy + r * Math.sin(a1)).toFixed(1);
        const x2 = (cx + r * Math.cos(a2)).toFixed(1), y2 = (cy + r * Math.sin(a2)).toFixed(1);
        const d = `M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 0 1 ${x2} ${y2} Z`;

        if (i < n) {
          const mid = (a1 + a2) / 2;
          const bx = (cx + r * 0.6 * Math.cos(mid)).toFixed(1);
          const by = (cy + r * 0.6 * Math.sin(mid)).toFixed(1);
          const cls = popLast && i === n - 1 ? ' class="pie-pop"' : "";
          out += `<g${cls}>
            <path d="${d}" fill="#E5B363" stroke="#D69847" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="${bx}" cy="${by}" r="7.5" fill="#C9252D"/>
            <circle cx="${(bx - 2.2).toFixed(1)}" cy="${(by - 2.4).toFixed(1)}" r="2" fill="#F29B9E"/>
          </g>`;
        } else {
          out += `<path d="${d}" fill="rgba(239,236,230,0.10)" stroke="#435E85" stroke-width="2.5" stroke-linejoin="round"/>`;
        }
      }
      if (n >= total) {
        out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#D69847" stroke-width="5"/>`;
      }
      return `<svg viewBox="0 0 100 100" class="w-full h-full">${out}</svg>`;
    }

    function setHudPie(n, popLast) {
      document.getElementById("hudPie").innerHTML = pieSvg(n, popLast);
    }

    /* ---------- Junebug: the other player picks the 5 targets ---------- */
    function beginPickPhase() {
      state.phase = "selecting";
      state.pickQueue = [];
      const picker = otherPlayer(state.hunter);

      document.getElementById("hudPlayerTag").textContent = `P${picker}`;
      document.getElementById("hudHuntBox").classList.add("hidden");
      document.getElementById("hudPickBox").classList.remove("hidden");
      document.getElementById("clockBox").classList.add("hidden");
      document.getElementById("hudPickText").textContent = `PICK ${TARGETS_PER_ROUND} FOR P${state.hunter}`;

      refreshPickBadges();
      updatePickUI(false);
    }

    function updatePickUI(popLast) {
      const n = state.pickQueue.length;
      const ready = n === TARGETS_PER_ROUND;
      setHudPie(n, popLast);
      const btn = document.getElementById("pickDoneBtn");
      btn.disabled = !ready;
      btn.classList.toggle("opacity-40", !ready);
    }

    function finishTargetSelectionPhase() {
      if (state.pickQueue.length !== TARGETS_PER_ROUND) return;
      state.targetUids = [...state.pickQueue];
      state.boardItems.forEach(it => {
        const b = document.getElementById(`qbadge_${it.uid}`);
        if (b) b.classList.add("hidden");
      });
      showCurtain(`PASS TO P${state.hunter}`, `P${otherPlayer(state.hunter)} picked ${TARGETS_PER_ROUND} for you!`, beginHunt);
    }

    /* ---------- the hunt ---------- */
     function beginHunt() {
       clearActiveTimer();
       state.phase = "hunting";
       state.found = 0;
       state.wrongTapStreak = 0;

       document.getElementById("hudPlayerTag").textContent = `P${state.hunter}`;
       document.getElementById("hudPickBox").classList.add("hidden");
       document.getElementById("hudHuntBox").classList.remove("hidden");
       document.getElementById("clockBox").classList.remove("hidden");
       setHudPie(0, false);

       setTarget(0);

       state.huntStartTs = performance.now();
       updateClockText(0);
       state.timerInterval = setInterval(() => {
         updateClockText(performance.now() - state.huntStartTs);
       }, 80);
       startMoving();
     }

     function beginSoloHunt() {
       clearActiveTimer();
       document.getElementById("doneOverlay").classList.add("hidden");
       document.getElementById("doneMsg").classList.add("hidden");
       document.getElementById("newPageBtn").classList.add("hidden");
       document.getElementById("doneTime").classList.remove("hidden");
       generateAndRenderSvgJumble();
       state.targetUids = shuffleArray(state.boardItems).map(it => it.uid);
       state.phase = "hunting";
       state.found = 0;
       state.wrongTapStreak = 0;

       document.getElementById("hudPlayerTag").textContent = "SOLO";
       document.getElementById("hudPickBox").classList.add("hidden");
       document.getElementById("hudHuntBox").classList.remove("hidden");
       document.getElementById("clockBox").classList.add("hidden");
       updateSoloProgress();

       setTarget(0);
       startMoving();
     }

     function updateSoloProgress() {
       document.getElementById("hudPie").innerHTML = `<span class="text-base font-black text-[#2A1B15] bg-[#E5B363] px-2 py-1 rounded-lg">${state.found}/${state.targetUids.length}</span>`;
     }

     function finishSolo() {
       clearActiveTimer();
       state.phase = "soloDone";
       playTone("win");
       document.getElementById("donePie").innerHTML = "";
       document.getElementById("doneTime").classList.add("hidden");
       document.getElementById("doneMsg").classList.remove("hidden");
       document.getElementById("newPageBtn").classList.remove("hidden");
       document.getElementById("doneOverlay").classList.remove("hidden");
     }

     function newSoloPage() {
       document.getElementById("doneOverlay").classList.add("hidden");
       beginSoloHunt();
     }

    function updateClockText(ms) {
      document.getElementById("clockText").textContent = fmtTime(ms);
    }

    function setTarget(idx) {
      clearHint();
      state.targetIdx = idx;
      const uid = state.targetUids[idx];
      state.currentTarget = state.boardItems.find(it => it.uid === uid) || null;
      if (state.currentTarget) renderCanonicalHUD(state.currentTarget);
      // HEAR: say the word right away for the first one, a beat after the chime for the rest
      if (state.clue === "hear" && state.currentTarget) speakClue(idx === 0 ? 0 : 400);
      state.hintTimer = setTimeout(showHint, HINT_MS);
    }

    function renderCanonicalHUD(item) {
      const badge = document.getElementById("hudCanonicalBadge");

      if (state.clue === "math" && item.clueText) {
        badge.innerHTML = `<span class="text-3xl sm:text-4xl font-black tracking-wide">${item.clueText}</span>`;
      } else if (state.clue === "hear" && CAN_SPEAK && item.category === "word") {
        // audio only: no letters on screen, just a button to hear it again
        badge.innerHTML = `
          <button type="button" onclick="speakClue(0)" class="flex items-center gap-2 px-4 py-0.5 rounded-xl bg-[#E5B363] border-b-4 border-[#D69847] text-[#2A1B15] font-black active:translate-y-0.5 transition">
            <span class="text-3xl leading-none">🔊</span>
            <span class="text-sm uppercase tracking-wide">hear it again</span>
          </button>`;
      } else {
        badge.innerHTML = `<span class="text-3xl sm:text-4xl font-black tracking-wider">${item.canonicalText}</span>`;
      }
    }

    /* ---------- the hint: a glowing ring instead of a penalty ---------- */
     function showHint() {
       if (state.clue === "hear" && state.phase === "hunting") speakClue(0);   // audio hint: say it again
       return;   // hints disabled
       const t = state.currentTarget;
       if (state.phase !== "hunting" || !t || !t.el || t.hintEl) return;
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "hint-ring");
      g.innerHTML = `
        <circle r="${t.hitR + 6}" fill="none" stroke="#2A1B15" stroke-width="15"/>
        <circle r="${t.hitR + 6}" fill="none" stroke="#E5B363" stroke-width="9"/>
      `;
      t.el.appendChild(g);
      t.hintEl = g;
    }

    function clearHint() {
      if (state.hintTimer) { clearTimeout(state.hintTimer); state.hintTimer = null; }
      const t = state.currentTarget;
      if (t && t.hintEl) { t.hintEl.remove(); t.hintEl = null; }
    }

    /********************************************************************
     * 6. TAPS, FINISHING, RESULTS
     ********************************************************************/
    function onItemTapped(item) {
      if (state.phase === "selecting") {
        const idx = state.pickQueue.indexOf(item.uid);
        if (idx !== -1) {
          state.pickQueue.splice(idx, 1);
          refreshPickBadges();
          updatePickUI(false);
        } else if (state.pickQueue.length < TARGETS_PER_ROUND) {
          state.pickQueue.push(item.uid);
          playTone("queue");
          refreshPickBadges();
          updatePickUI(true);
        } else {
          playTone("wrong");   // already picked 5: tap one to un-pick it
        }
        return;
      }

      if (state.phase !== "hunting" || !state.currentTarget) return;

      if (item.uid === state.currentTarget.uid) {
        playTone("find");
        if (item.category === "word") noteWordFound(item.canonicalText);
        clearHint();
        // pop it off the board
        if (item.el) {
          item.el.style.transition = "opacity .25s";
          item.el.style.opacity = "0";
          item.el.style.pointerEvents = "none";
        }
        spawnSvgRing(item.cx, item.cy, "#38B449", 450);
         state.found++;
         state.wrongTapStreak = 0;
         if (state.mode === "solo") updateSoloProgress();
         else setHudPie(state.found, true);

         if (state.mode === "solo") {
           if (state.found >= state.targetUids.length) finishSolo();
           else setTarget(state.found);
         } else if (state.found >= TARGETS_PER_ROUND) finishLeg();
         else setTarget(state.found);
      } else {
        playTone("wrong");
        spawnSvgRing(item.cx, item.cy, "#C9252D", 300);
        state.wrongTapStreak++;
        if (state.wrongTapStreak >= 3) showHint();   // stuck? help, don't punish
      }
    }

    function refreshPickBadges() {
      state.boardItems.forEach(item => {
        const b = document.getElementById(`qbadge_${item.uid}`);
        const t = document.getElementById(`qtext_${item.uid}`);
        if (!b || !t) return;
        const idx = state.pickQueue.indexOf(item.uid);
        if (idx === -1) {
          b.classList.add("hidden");
        } else {
          t.textContent = String(idx + 1);
          b.classList.remove("hidden");
        }
      });
    }

    function spawnSvgRing(cx, cy, color, durationMs) {
      const fb = document.getElementById("feedbackLayer");
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", String(cx));
      c.setAttribute("cy", String(cy));
      c.setAttribute("r", "34");
      c.setAttribute("fill", "none");
      c.setAttribute("stroke", color);
      c.setAttribute("stroke-width", "7");
      c.setAttribute("class", "beacon-circle");
      fb.appendChild(c);
      if (durationMs) setTimeout(() => c.remove(), durationMs);
      return c;
    }

    function finishLeg() {
      const elapsed = performance.now() - state.huntStartTs;
      clearActiveTimer();
      state.phase = "legDone";
      state.times[state.hunter] = elapsed;
      updateClockText(elapsed);
      playTone("win");

      // big baked pie + your time
      document.getElementById("donePie").innerHTML = pieSvg(TARGETS_PER_ROUND, false);
      document.getElementById("doneTime").textContent = fmtTime(elapsed);
      document.getElementById("doneOverlay").classList.remove("hidden");

      state.flowTimer = setTimeout(() => {
        state.flowTimer = null;
        if (state.leg === 0) {
          const prev = state.hunter;
          state.leg = 1;
          state.hunter = otherPlayer(prev);
          setupLeg(`P${prev} took ${fmtTime(elapsed)}. Beat it!`);
        } else {
          document.getElementById("doneOverlay").classList.add("hidden");
          showSummaryModal();
        }
      }, 1500);
    }

    function showSummaryModal() {
      state.phase = "summary";
      // compare the times the players actually saw (1 decimal)
      const t1 = Math.round(state.times[1] / 100);
      const t2 = Math.round(state.times[2] / 100);
      const winner = t1 === t2 ? 0 : (t1 < t2 ? 1 : 2);
      if (winner === 1) state.p1TotalScore++;
      if (winner === 2) state.p2TotalScore++;

      document.getElementById("summaryTurnTitle").textContent = winner ? `P${winner} WINS!` : "TIE!";
      [1, 2].forEach(p => {
        document.getElementById(`sumP${p}Time`).textContent = fmtTime(state.times[p]);
        document.getElementById(`sumP${p}Wins`).textContent = `WINS: ${p === 1 ? state.p1TotalScore : state.p2TotalScore}`;
        document.getElementById(`sumCell${p}`).classList.toggle("sum-win", winner === p);
      });
      document.getElementById("summaryModal").classList.remove("hidden");
    }

    function advanceFromSummary() {
      document.getElementById("summaryModal").classList.add("hidden");
      state.firstHunter = otherPlayer(state.firstHunter);   // take turns going first
      startRound();
    }

    function returnToLobby() {
      clearActiveTimer();
      state.phase = "lobby";
      document.getElementById("gameScreen").classList.add("hidden");
      document.getElementById("summaryModal").classList.add("hidden");
      document.getElementById("curtainScreen").classList.add("hidden");
      document.getElementById("doneOverlay").classList.add("hidden");
      document.getElementById("lobbyScreen").classList.remove("hidden");
      syncLobbyUI();
    }

    function clearActiveTimer() {
      stopSpeaking();
      if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
      if (state.flowTimer) { clearTimeout(state.flowTimer); state.flowTimer = null; }
      clearHint();
      stopMoving();
    }

    let moveRaf = null;
    function startMoving() {
      if (moveRaf || !state.moving) return;
      const W = 800;
      const H = 1050;
      const step = () => {
        if (!state.moving || state.phase !== "hunting") {
          moveRaf = null;
          return;
        }
        state.boardItems.forEach(item => {
          if (item.vx == null && item.vy == null) return;
          item.cx += item.vx;
          item.cy += item.vy;
          const r = (item.hitR || 30) + 4;
          if (item.cx - r < 24) { item.cx = 24 + r; item.vx *= -1; }
          if (item.cx + r > W - 24) { item.cx = W - 24 - r; item.vx *= -1; }
          if (item.cy - r < 24) { item.cy = 24 + r; item.vy *= -1; }
          if (item.cy + r > H - 24) { item.cy = H - 24 - r; item.vy *= -1; }
          if (item.el) item.el.setAttribute("transform", `translate(${Math.round(item.cx)}, ${Math.round(item.cy)})`);
        });
        moveRaf = requestAnimationFrame(step);
      };
      moveRaf = requestAnimationFrame(step);
    }
    function stopMoving() {
      if (moveRaf) { cancelAnimationFrame(moveRaf); moveRaf = null; }
    }

    function unlockHubIframeScroll() {
      try {
        if (window.frameElement) {
          window.frameElement.setAttribute("scrolling", "yes");
          window.frameElement.style.overflow = "auto";
        }
      } catch (e) {}
    }

    window.addEventListener("DOMContentLoaded", () => {
      unlockHubIframeScroll();
      syncLobbyUI();
    });
    window.addEventListener("load", unlockHubIframeScroll);
  </script>
</body>
</html>
