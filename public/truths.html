<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write Something True</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Be+Vietnam+Pro:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#141b16;--card:#0d120e;--txt:#dfcbb3;--acc:#a64132;--mut:#868072;--bdr:rgba(223,203,179,.12)}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--txt);max-width:600px;margin:5vh auto;padding:20px;line-height:1.6}
h1,h2{font-family:'Fraunces',serif;font-weight:600;text-align:center;margin:0 0 5px}
h2{margin-top:60px;font-size:1.5rem;color:var(--acc)}
#intro,#st{color:var(--mut);text-align:center;font-size:.9rem;margin-bottom:20px}
#tx{width:100%;box-sizing:border-box;font-family:'Fraunces',serif;font-size:1.35rem;background:var(--bg);color:var(--txt);border:1px solid var(--bdr);border-radius:12px;padding:20px;margin:0 0 20px;resize:none;text-align:center}
#tx:focus{outline:0;border-color:var(--acc)}
.bw{text-align:center}
#go{background:var(--card);color:var(--acc);border:1px solid var(--bdr);padding:10px 24px;border-radius:20px;font-size:1rem;cursor:pointer}
#go:hover{border-color:var(--acc)}
#book{display:flex;flex-direction:column;gap:15px;margin-top:20px}
.v{background:var(--card);border:1px solid var(--bdr);border-radius:22px 6px;padding:24px;text-align:center}
.v p{font-family:'Fraunces',serif;font-size:1.4rem;margin:0 0 10px;line-height:1.6}
.v span{font-size:.85rem;color:var(--acc);opacity:.8}
</style>
</head>
<body>
<h1>Write Something True</h1>
<p id="intro">One true line a day. Editable until midnight, permanently saved in the book after.</p>
<div id="st">Loading…</div>
<div><textarea id="tx" rows="3" maxlength="140" placeholder="Something true..."></textarea></div>
<div class="bw"><button id="go">Lay it in the book</button></div>

<h2>The Book</h2>
<div id="book"></div>

<script>
var API='https://script.google.com/macros/s/AKfycbwhy40Gk_QPoVz-jEwe-I72_rqbudw_QeLxZcGz7e2BMH3kIYS0AWkBiRulJl-CfU5jyA/exec';
var $=function(id){return document.getElementById(id)},ALL=[];
function today(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mine(){var u='';try{u=localStorage.getItem('truth:uid')||''}catch(e){}
if(!u){u='f-'+Math.random().toString(36).slice(2,10);try{localStorage.setItem('truth:uid',u)}catch(e2){}}return u}
function seal(){
  var t=today(),m=mine(),found=null,i;
  for(i=0;i<ALL.length;i++)if(ALL[i].name===m&&ALL[i].date===t)found=ALL[i];
  if(found){$('tx').value=found.text;$('go').textContent="Amend today's line (permanently saved in the book at midnight)";$('intro').style.display='none'}
  else if($('tx').value===''||document.activeElement!==$('tx')){$('tx').value='';$('go').textContent='Lay it in the book'}
}
function render(){
  var seen={},list=[],i,e,k,h='';
  for(i=0;i<ALL.length;i++){e=ALL[i];seen[e.name+'|'+e.date]=e}
  for(k in seen)list.push(seen[k]);
  list.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
  for(i=0;i<list.length;i++)h+='<div class="v"><p>'+esc(list[i].text)+'</p><span>'+esc(list[i].date)+'</span></div>';
  $('book').innerHTML=h||'<div class="v"><p>No truths written yet.</p></div>';
  seal();
}
function load(){
  $('st').textContent='Loading…';
  fetch(API,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    ALL=(j.entries||[]).filter(function(e){return e&&e.book==='truth'&&e.text}).map(function(e){
      return {name:String(e.name||'Anon').slice(0,20),text:String(e.text).replace(/\s+/g,' ').trim().slice(0,140),date:String(e.date||'').slice(0,10)}});
    try{localStorage.setItem('truth:cache',JSON.stringify(ALL))}catch(e2){}
    $('st').textContent='';render();
  }).catch(function(){$('st').textContent='Offline — showing saved copy.';try{ALL=JSON.parse(localStorage.getItem('truth:cache')||'[]')}catch(e){ALL=[]}render()});
}
$('go').addEventListener('click',function(){
  var m=mine(),t=($('tx').value||'').replace(/\s+/g,' ').trim().slice(0,140);
  if(!t){$('st').textContent='Write something first.';return}
  $('st').textContent='Saving…';
  fetch(API+'?'+new URLSearchParams({book:'truth',name:m,text:t,date:today()}),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    if(j&&j.entries)ALL=j.entries.filter(function(e){return e&&e.book==='truth'&&e.text}).map(function(e){
      return {name:String(e.name||'Anon').slice(0,20),text:String(e.text).replace(/\s+/g,' ').trim().slice(0,140),date:String(e.date||'').slice(0,10)}});
    else ALL.push({name:m,text:t,date:today()});
    try{localStorage.setItem('truth:cache',JSON.stringify(ALL))}catch(e2){}
    $('st').textContent='Permanently saved in the book for today — editable until midnight.';
    $('intro').style.display='none';
    render();
  }).catch(function(){$('st').textContent='Could not save. Keep the tab open and retry.'});
});
load();
</script>
</body>
</html>
