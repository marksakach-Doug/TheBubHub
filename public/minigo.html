<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>minigo</title>
<style>
html,body{height:100%;margin:0;background:#0f172a;color:#e2e8f0;font:15px system-ui,sans-serif}
#g{height:100dvh;max-width:560px;margin:0 auto;padding:8px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
.top{display:flex;gap:8px}
.chip{flex:1;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#1e293b;border:2px solid transparent;min-width:0}
.chip.on{border-color:#d9a05b}
.chip b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{margin-left:auto;color:#94a3b8;white-space:nowrap}
.dot{flex:0 0 18px;height:18px;border-radius:50%}
.dot.b{background:radial-gradient(circle at 35% 30%,#666,#000)}
.dot.w{background:radial-gradient(circle at 35% 30%,#fff,#c9c9c9);box-shadow:0 0 0 1px #888}
#st{min-height:20px;text-align:center;font-size:14px;color:#e2e8f0}
canvas{flex:1 1 0;min-height:0;width:100%;object-fit:contain;touch-action:manipulation}
.row{display:flex;gap:8px}
button{flex:1;font:inherit;border:0;border-radius:10px;padding:10px;min-height:46px;background:#334155;color:#fff;cursor:pointer}
button:hover{background:#475569}
button:focus-visible{outline:2px solid #d9a05b;outline-offset:2px}
button[hidden]{display:none}
button.dim{opacity:.45}
</style>
</head>
<body>
<div id="g">
  <div class="top">
    <div class="chip" id="c1"><span class="dot b"></span><b id="n1">Black</b><small id="p1"></small></div>
    <div class="chip" id="c2"><span class="dot w"></span><b id="n2">White</b><small id="p2"></small></div>
  </div>
  <div id="st">Connecting...</div>
  <canvas id="c" width="1280" height="1280" aria-label="7 by 7 Go board"></canvas>
  <div class="row"><button id="b1">Pass</button><button id="b2">Resign</button></div>
</div>
<script>
(function(){
'use strict';
var GID='minigo',N=7,KOMI=7.5,SZ=640,M=50,CELL=90;
var $=function(i){return document.getElementById(i)};

// ---------- hub bridge (same protocol as the other games) ----------
var Hub={me:null,roster:[],up:function(k,p){try{window.parent.postMessage({t:'gu',game:GID,k:k,p:p},'*')}catch(e){}}};
var S=null,local=false,note='',noteT=0,hov=-1,resArm=0,goInst=0,reported=false;
function myId(){return Hub.me&&Hub.me.id}
function isHost(){return !!(Hub.me&&Hub.me.isHost)}
function send(d){if(isHost())onIntent(d,{id:myId()});else Hub.up('intent',d)}
function onDown(e){
  var m=e.data;if(!m||m.t!=='gd'||m.game!==GID)return;
  if(m.k==='roster'){Hub.me=m.p.you;Hub.roster=m.p.roster||[];onRoster()}
  else if(m.k==='state'){if(!isHost()&&m.p){S=m.p;refresh()}}
  else if(m.k==='intent'){if(isHost())onIntent(m.p,m.from)}
}

// ---------- the rules (pure functions) ----------
function nbrs(i){var x=i%N,y=(i/N)|0,r=[];if(x>0)r.push(i-1);if(x<N-1)r.push(i+1);if(y>0)r.push(i-N);if(y<N-1)r.push(i+N);return r}
function group(b,i){   // the connected same-colour stones and their liberties
  var c=b[i],st=[i],seen={},libs={},q=[i];seen[i]=1;
  while(q.length){nbrs(q.pop()).forEach(function(j){
    if(b[j]===0)libs[j]=1;
    else if(b[j]===c&&!seen[j]){seen[j]=1;st.push(j);q.push(j)}
  })}
  return{st:st,libs:Object.keys(libs)};
}
// Legal move? Captures first, then no suicide, then no repeating any earlier whole-board position (superko, which includes simple ko).
function legal(b,hist,i,c){
  if(b[i])return{err:'That point is taken.'};
  var nb=b.slice(),n=0;nb[i]=c;
  nbrs(i).forEach(function(j){
    if(nb[j]===3-c){var g=group(nb,j);if(!g.libs.length)g.st.forEach(function(k){nb[k]=0;n++})}
  });
  if(!group(nb,i).libs.length)return{err:'Suicide is not allowed.'};
  var key=nb.join('');
  if(hist.indexOf(key)>=0)return{err:'Ko: that would repeat an earlier position.'};
  return{b:nb,n:n,key:key};
}
// Area scoring: stones + surrounded empty points. Dead-marked stones are lifted first.
function score(s){
  var b=s.b.map(function(v,i){return s.dead[i]?0:v}),sc={1:0,2:0},terr=[],seen={};
  for(var i=0;i<N*N;i++)terr.push(0);
  b.forEach(function(v,i){if(v)sc[v]++});
  for(i=0;i<N*N;i++){
    if(b[i]||seen[i])continue;
    var reg=[i],q=[i],edge={};seen[i]=1;
    while(q.length){nbrs(q.pop()).forEach(function(j){
      if(b[j])edge[b[j]]=1;else if(!seen[j]){seen[j]=1;reg.push(j);q.push(j)}
    })}
    var cs=Object.keys(edge);
    if(cs.length===1){var c=+cs[0];sc[c]+=reg.length;reg.forEach(function(k){terr[k]=c})}
  }
  sc.terr=terr;return sc;
}
function fresh(){var z=[];for(var i=0;i<N*N;i++)z.push(0);return z}

// ---------- host: the game ----------
function newGame(keepSeats,swap){
  var pl=S?S.players:{1:null,2:null},nm=S?S.names:{};
  if(swap){pl={1:pl[2],2:pl[1]}}
  S={b:fresh(),turn:1,cap:[0,0],hist:[fresh().join('')],passes:0,phase:'play',dead:fresh(),acc:[0,0],
     last:null,result:'',won:0,players:pl,names:nm};
  reported=false;
}
function onRoster(){
  if(!isHost()){Hub.up('intent',{a:'hello'});return}
  if(!S)newGame();
  var ids={};Hub.roster.forEach(function(m){ids[m.id]=1;S.names[m.id]=m.name});
  [1,2].forEach(function(c){if(S.players[c]&&!ids[S.players[c]])S.players[c]=null});
  Hub.roster.forEach(function(m){
    if(S.players[1]===m.id||S.players[2]===m.id)return;
    if(!S.players[1])S.players[1]=m.id;else if(!S.players[2])S.players[2]=m.id;
  });
  broadcast();
}
function broadcast(){Hub.up('state',S);refresh()}
function actor(id){return local?S.turn:(S.players[1]===id?1:S.players[2]===id?2:0)}
function finish(){
  var sc=score(S),w=sc[2]+KOMI,d=sc[1]-w;
  S.result=(d>0?'Black':'White')+' wins by '+Math.abs(d)+'  (Black '+sc[1]+', White '+sc[2]+' + '+KOMI+' komi)';
  S.won=d>0?2:1;
  S.phase='over';
  reportResult();
}
// MiniGo used to end without ever telling the hub, so it left no record line
// at all. Both endings (scored and resignation) set S.won to the winning
// colour — 1 is White, 2 is Black — and come through here.
function reportResult(){
  if(reported||!S||!S.won||!isHost())return;
  reported=true;
  var w=S.names[S.players[S.won]]||'Someone',l=S.names[S.players[3-S.won]]||'the other player';
  Hub.up('result',{inst:'go-'+(++goInst),text:w+' beat '+l+' at MiniGo'});
}
function onIntent(d,from){
  if(!S||!d||!from)return;
  var c=actor(from.id),a=d.a;
  if(a==='hello'){broadcast();return}
  if(!c)return;
  if(a==='play'&&S.phase==='play'&&c===S.turn&&(local||(S.players[1]&&S.players[2]))){
    var r=legal(S.b,S.hist,d.i|0,c);if(r.err)return;
    S.b=r.b;S.cap[c]+=r.n;S.hist.push(r.key);S.passes=0;S.last={c:c,i:d.i|0};S.turn=3-c;
  }else if(a==='pass'&&S.phase==='play'&&c===S.turn&&(local||(S.players[1]&&S.players[2]))){
    S.passes++;S.last={c:c,i:-1};S.turn=3-c;
    if(S.passes>=2){S.phase='score';S.dead=fresh();S.acc=[0,0]}
  }else if(a==='resign'&&(S.phase==='play'||S.phase==='score')){
    S.result=(c===1?'White':'Black')+' wins by resignation';S.won=c;S.phase='over';reportResult();
  }else if(a==='mark'&&S.phase==='score'){
    var i=d.i|0;if(!S.b[i])return;
    var g=group(S.b,i),v=S.dead[i]?0:1;g.st.forEach(function(k){S.dead[k]=v});S.acc=[0,0];
  }else if(a==='accept'&&S.phase==='score'){
    if(local)S.acc=[1,1];else S.acc[c-1]=1;
    if(S.acc[0]&&S.acc[1])finish();
  }else if(a==='resume'&&S.phase==='score'){
    S.phase='play';S.passes=0;S.dead=fresh();S.acc=[0,0];
  }else if(a==='new'&&S.phase==='over'){
    newGame(true,!local);
  }else return;
  broadcast();
}

// ---------- drawing ----------
var cv=$('c'),ctx=cv.getContext('2d');ctx.scale(2,2);
function px(i){return M+(i%N)*CELL}
function py(i){return M+((i/N)|0)*CELL}
function stone(x,y,c,al){
  ctx.globalAlpha=al;
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.arc(x+3,y+4,38,0,7);ctx.fill();
  var g=ctx.createRadialGradient(x-12,y-14,4,x,y,40);
  if(c===1){g.addColorStop(0,'#6a6a6a');g.addColorStop(1,'#000')}else{g.addColorStop(0,'#fff');g.addColorStop(1,'#cfcfcf')}
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,38,0,7);ctx.fill();
  if(c===2){ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;ctx.stroke()}
  ctx.globalAlpha=1;
}
function draw(){
  ctx.clearRect(0,0,SZ,SZ);
  var g=ctx.createLinearGradient(0,0,SZ,SZ);g.addColorStop(0,'#c98f55');g.addColorStop(1,'#a56a35');
  ctx.fillStyle=g;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(0,0,SZ,SZ,22);else ctx.rect(0,0,SZ,SZ);ctx.fill();
  ctx.strokeStyle='rgba(80,45,15,.12)';ctx.lineWidth=2;
  for(var k=0;k<16;k++){var y=k*42+10;ctx.beginPath();ctx.moveTo(0,y);ctx.quadraticCurveTo(SZ/2,y+14*Math.sin(k*1.7),SZ,y+6*Math.cos(k));ctx.stroke()}
  ctx.strokeStyle='#432610';ctx.lineWidth=2.5;
  for(k=0;k<N;k++){
    ctx.beginPath();ctx.moveTo(M,M+k*CELL);ctx.lineTo(M+(N-1)*CELL,M+k*CELL);ctx.stroke();
    ctx.beginPath();ctx.moveTo(M+k*CELL,M);ctx.lineTo(M+k*CELL,M+(N-1)*CELL);ctx.stroke();
  }
  ctx.fillStyle='#432610';
  [[2,2],[2,4],[4,2],[4,4],[3,3]].forEach(function(p){ctx.beginPath();ctx.arc(M+p[0]*CELL,M+p[1]*CELL,6,0,7);ctx.fill()});
  if(!S)return;
  var sc=S.phase!=='play'?score(S):null,i;
  for(i=0;i<N*N;i++){
    if(S.b[i]){stone(px(i),py(i),S.b[i],S.dead[i]?.4:1);
      if(S.dead[i]){ctx.strokeStyle='#e5484d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(px(i)-12,py(i)-12);ctx.lineTo(px(i)+12,py(i)+12);ctx.moveTo(px(i)+12,py(i)-12);ctx.lineTo(px(i)-12,py(i)+12);ctx.stroke()}}
    else if(sc&&sc.terr[i]){ctx.fillStyle=sc.terr[i]===1?'#111':'#f4f4f4';ctx.strokeStyle='#432610';ctx.lineWidth=1.5;ctx.beginPath();ctx.rect(px(i)-11,py(i)-11,22,22);ctx.fill();ctx.stroke()}
  }
  if(S.last&&S.last.i>=0&&S.phase==='play'){ctx.strokeStyle='#e5484d';ctx.lineWidth=4;ctx.beginPath();ctx.arc(px(S.last.i),py(S.last.i),14,0,7);ctx.stroke()}
  if(hov>=0&&S.phase==='play'&&canMove()&&!legal(S.b,S.hist,hov,S.turn).err)stone(px(hov),py(hov),S.turn,.5);
}

// ---------- ui ----------
function myColor(){if(!S)return 0;return actor(myId())}
function canMove(){return S&&S.phase==='play'&&(local||(S.players[1]&&S.players[2]))&&myColor()===S.turn}
function nm(c){
  var id=S.players[c],base=c===1?'Black':'White';
  if(local)return base;
  return id?(S.names[id]||base)+(id===myId()?' (you)':''):'waiting...';
}
function refresh(){
  draw();
  var b1=$('b1'),b2=$('b2');
  if(!S){$('st').textContent='Connecting...';return}
  $('n1').textContent=nm(1);$('n2').textContent=nm(2);
  $('p1').textContent=S.cap[1]?'took '+S.cap[1]:'';$('p2').textContent=S.cap[2]?'took '+S.cap[2]:'';
  $('c1').className='chip'+(S.phase==='play'&&S.turn===1?' on':'');
  $('c2').className='chip'+(S.phase==='play'&&S.turn===2?' on':'');
  var t='',me=myColor(),seated=local||(S.players[1]&&S.players[2]);
  if(S.phase==='play'){
    var lp=S.last&&S.last.i<0?(S.last.c===1?'Black':'White')+' passed. ':'';
    if(!seated)t='Waiting for an opponent to join...';
    else if(local)t=lp+(S.turn===1?'Black':'White')+' to play.';
    else if(!me)t='Watching. '+nm(S.turn)+' to play.';
    else t=lp+(me===S.turn?'Your move.':'Waiting for '+nm(S.turn)+'...');
    b1.textContent='Pass';b2.textContent=resArm?'Tap again to resign':'Resign';b1.hidden=false;b2.hidden=false;
    b1.className=canMove()?'':'dim';b2.className=me||local?'':'dim';
  }else if(S.phase==='score'){
    var sc=score(S),w=sc[2]+KOMI;
    t='Tap dead groups to mark them. Black '+sc[1]+'  White '+sc[2]+' + '+KOMI+' = '+w+'.'+(S.acc[0]||S.acc[1]?' (accepted: '+(S.acc[0]?'Black ':'')+(S.acc[1]?'White':'')+')':'');
    b1.textContent='Accept score';b2.textContent='Keep playing';b1.hidden=false;b2.hidden=false;
    b1.className=me||local?'':'dim';b2.className=me||local?'':'dim';
  }else{
    t=S.result;b1.textContent='New game';b1.hidden=false;b2.hidden=true;b1.className=me||local?'':'dim';
  }
  if(note&&Date.now()<noteT)t=note;
  $('st').textContent=t;
}
function flash(s){note=s;noteT=Date.now()+2600;refresh();setTimeout(refresh,2700)}
function at(e){
  var r=cv.getBoundingClientRect(),s=Math.min(r.width/SZ,r.height/SZ);
  var x=(e.clientX-r.left-(r.width-SZ*s)/2)/s,y=(e.clientY-r.top-(r.height-SZ*s)/2)/s;
  var cx=Math.round((x-M)/CELL),cy=Math.round((y-M)/CELL);
  if(cx<0||cy<0||cx>=N||cy>=N)return -1;
  return Math.hypot(x-(M+cx*CELL),y-(M+cy*CELL))<CELL*.5?cy*N+cx:-1;
}
cv.addEventListener('pointerdown',function(e){
  if(!S)return;var i=at(e);if(i<0)return;
  if(S.phase==='score'){if(S.b[i]&&(myColor()||local))send({a:'mark',i:i});return}
  if(S.phase!=='play')return;
  if(!(local||(S.players[1]&&S.players[2])))return flash('Waiting for an opponent to join...');
  if(!myColor())return flash('You are watching this game.');
  if(myColor()!==S.turn)return flash('Not your turn.');
  var r=legal(S.b,S.hist,i,S.turn);if(r.err)return flash(r.err);
  hov=-1;send({a:'play',i:i});
});
cv.addEventListener('pointermove',function(e){if(e.pointerType!=='mouse')return;var i=at(e);if(i!==hov){hov=i;draw()}});
cv.addEventListener('pointerleave',function(){hov=-1;draw()});
$('b1').addEventListener('click',function(){
  if(!S)return;
  if(S.phase==='play'){if(canMove())send({a:'pass'})}
  else if(S.phase==='score'){if(myColor()||local)send({a:'accept'})}
  else if(S.phase==='over'){if(myColor()||local)send({a:'new'})}
  this.blur();
});
$('b2').addEventListener('click',function(){
  if(!S)return;
  if(S.phase==='play'){
    if(!(myColor()||local))return;
    if(!resArm){resArm=1;refresh();setTimeout(function(){resArm=0;refresh()},3000)}
    else{resArm=0;send({a:'resign'})}
  }else if(S.phase==='score'){if(myColor()||local)send({a:'resume'})}
  this.blur();
});

Hub.up('height',720);   // only used outside focus mode
window.addEventListener('message',onDown);
Hub.up('hello');
setTimeout(function(){
  if(Hub.me)return;
  local=true;Hub.me={id:'me',name:'You',isHost:true};Hub.roster=[{id:'me',name:'You',host:true}];onRoster();
},window.parent===window?50:1500);
draw();
})();
</script>
</body>
</html>
