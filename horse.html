<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>horse</title>
<style>
html,body{height:100%;margin:0;background:#fef3c7;font:16px system-ui,sans-serif;color:#1e293b}
#g{height:100dvh;box-sizing:border-box;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
#h{font-size:96px;cursor:pointer;user-select:none}
#b{background:#fff;border-radius:14px;padding:14px 16px;max-width:520px;width:100%;box-sizing:border-box;white-space:pre-wrap;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,.12);overflow:auto;max-height:60vh}
button{font:inherit;border:0;border-radius:10px;padding:10px 18px;background:#334155;color:#fff;cursor:pointer;min-height:44px}
</style>
</head>
<body>
<div id="g">
  <div id="h" role="button" aria-label="horse, tap for another entry">🐴</div>
  <div id="b">Loading...</div>
  <button id="n">Another</button>
</div>
<script>
(function(){
'use strict';
var E=[];
function pick(){
  var b=document.getElementById('b');
  if(!E.length){b.textContent='No entries found.';return}
  b.textContent=E[Math.floor(Math.random()*E.length)];
}
fetch('english-vietnamese.txt').then(function(r){
  if(!r.ok)throw new Error(r.status);
  return r.text();
}).then(function(t){
  // every entry starts at an @ sign and runs up to the next one
  E=t.split('@').slice(1).map(function(s){return s.replace(/\s+$/,'')}).filter(Boolean);
  pick();
}).catch(function(){
  document.getElementById('b').textContent='Could not load english-vietnamese.txt. Check that it is in the same folder as this file.';
});
document.getElementById('h').addEventListener('click',pick);
document.getElementById('n').addEventListener('click',pick);
})();
</script>
</body>
</html>
