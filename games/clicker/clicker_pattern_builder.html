<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarkDoug Pattern Composer</title>
  <style>
    :root {
      --bg: #121722;
      --panel: #1d2434;
      --border: #2b3448;
      --text: #e8ecf4;
      --red: #ff4d4d;
      --yellow: #facc15;
      --blue: #2f6bd8;
      --green: #4cd137;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 440px) minmax(280px, 360px);
      gap: 20px;
      width: 100%;
      max-width: 840px;
    }
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 4px;
      width: 100%;
      aspect-ratio: 1 / 1;
      user-select: none;
    }
    .cell {
      background: #151b28;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.65);
      transition: transform 0.08s ease, background 0.1s ease;
    }
    .cell span.note {
      font-size: 9px;
      font-weight: 500;
      opacity: 0.45;
    }
    .cell:hover { border-color: #54658a; }
    .cell.in-seq { background: var(--blue); color: #fff; }
    .cell.in-seq span.note { opacity: 0.8; }
    .cell.first { background: var(--red); color: #fff; }
    .cell.second { background: var(--yellow); color: #111; }
    .cell.playing { transform: scale(0.9); outline: 2px solid var(--green); }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button {
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #3a465f;
      background: #232c3f;
      color: var(--text);
      cursor: pointer;
    }
    button.primary { background: var(--green); color: #111; border-color: var(--green); }
    button.danger { background: var(--red); color: #fff; border-color: var(--red); }
    input[type="number"] {
      width: 68px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #3a465f;
      background: #121722;
      color: var(--text);
      font: inherit;
    }
    textarea {
      width: 100%;
      min-height: 150px;
      background: #121722;
      color: #8ef5a0;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      resize: vertical;
    }
    .saved-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }
    .saved-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #151b28;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="panel">
      <div class="controls">
        <button class="primary" id="playBtn">Play Sequence</button>
        <button id="undoBtn">Undo Step</button>
        <button id="clearBtn">Clear Grid</button>
        <label style="font-size:13px;margin-left:auto;">
          BPM <input type="number" id="bpmInput" value="220" min="60" max="600" />
        </label>
      </div>
      <div class="board" id="board"></div>
      <div style="font-size:12px;opacity:0.75;" id="stepCount">0 steps in current pattern (Rows: A Mixolydian, Cols: +Half Steps)</div>
    </div>

    <div class="panel">
      <div class="controls">
        <button class="primary" id="savePatternBtn">Add Pattern to List</button>
        <button id="copyBtn">Copy Code</button>
      </div>
      <div class="saved-list" id="savedList"></div>
      <textarea id="exportBox" readonly></textarea>
    </div>
  </div>

  <script>
    const GRID = 9;
    const CELLS = GRID * GRID;
    // A Mixolydian from bottom row (A3) to top row (B4)
    const SCALE = [220.00, 246.94, 277.18, 293.66, 329.63, 369.99, 392.00, 440.00, 493.88];
    const CHROMATIC = ['A', 'A#', 'B', 'C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#'];
    // Semitone offsets above A3 for each row in A Mixolydian:
    const ROW_SEMITONES = [0, 2, 4, 5, 7, 9, 10, 12, 14];

    let actx = null;
    let currentSeq = [];
    let savedPatterns = [];
    let playTimer = null;

    function cellAt(cell) {
      return { col: cell % GRID, row: Math.floor(cell / GRID) };
    }

    function cellFreq(cell) {
      const p = cellAt(cell);
      return SCALE[GRID - 1 - p.row] * Math.pow(2, p.col / 12);
    }

    function cellNoteName(cell) {
      const p = cellAt(cell);
      const rIdx = GRID - 1 - p.row;
      const semi = ROW_SEMITONES[rIdx] + p.col;
      const name = CHROMATIC[semi % 12];
      const oct = 3 + Math.floor((semi + 9) / 12);
      return name + oct;
    }

    function voice(freq, gainVal, dur, type = 'triangle', delay = 0) {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime + delay;
      const osc = actx.createOscillator();
      const g = actx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(gainVal, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g);
      g.connect(actx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    function playStepSound(redCell, yellowCell) {
      voice(cellFreq(redCell), 0.24, 0.18, 'triangle', 0);
      if (yellowCell != null) {
        voice(cellFreq(yellowCell), 0.14, 0.26, 'sine', 0.045);
      }
    }

    const boardEl = document.getElementById('board');
    const stepCountEl = document.getElementById('stepCount');
    const savedListEl = document.getElementById('savedList');
    const exportBox = document.getElementById('exportBox');

    const cellEls = Array.from({ length: CELLS }, (_, i) => {
      const el = document.createElement('div');
      el.className = 'cell';
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const existingIdx = currentSeq.indexOf(i);
        if (existingIdx !== -1) {
          currentSeq.splice(existingIdx, 1);
        } else {
          const prev = currentSeq.length > 0 ? currentSeq[currentSeq.length - 1] : null;
          currentSeq.push(i);
          if (prev != null) playStepSound(prev, i);
          else playStepSound(i, null);
        }
        renderBoard();
      });
      boardEl.appendChild(el);
      return el;
    });

    function renderBoard(activeIdx = -1) {
      cellEls.forEach((el, i) => {
        const idx = currentSeq.indexOf(i);
        el.className = 'cell';
        const noteSpan = `<span class="note">${cellNoteName(i)}</span>`;
        if (idx !== -1) {
          el.classList.add('in-seq');
          if (idx === 0) el.classList.add('first');
          else if (idx === 1) el.classList.add('second');
          el.innerHTML = `<div>${idx + 1}</div>${noteSpan}`;
        } else {
          el.innerHTML = noteSpan;
        }
        if (i === activeIdx) el.classList.add('playing');
      });
      stepCountEl.textContent = `${currentSeq.length} steps in current pattern (Rows: A Mixolydian, Cols: +Half Steps)`;
    }

    function updateExport() {
      const lines = savedPatterns.map((p) => '  [' + p.join(', ') + ']');
      exportBox.value = 'const PATTERNS = [\n' + lines.join(',\n') + '\n];';
      savedListEl.innerHTML = '';
      savedPatterns.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'saved-item';
        row.innerHTML = `<span>Pattern #${idx + 1} (${p.length} notes)</span>`;
        const actions = document.createElement('div');
        actions.style.display = 'flex';
        actions.style.gap = '6px';

        const loadBtn = document.createElement('button');
        loadBtn.textContent = 'Load';
        loadBtn.onclick = () => { currentSeq = p.slice(); renderBoard(); };

        const delBtn = document.createElement('button');
        delBtn.className = 'danger';
        delBtn.textContent = 'X';
        delBtn.onclick = () => { savedPatterns.splice(idx, 1); updateExport(); };

        actions.append(loadBtn, delBtn);
        row.appendChild(actions);
        savedListEl.appendChild(row);
      });
    }

    document.getElementById('undoBtn').onclick = () => {
      currentSeq.pop();
      renderBoard();
    };

    document.getElementById('clearBtn').onclick = () => {
      currentSeq = [];
      renderBoard();
    };

    document.getElementById('savePatternBtn').onclick = () => {
      if (currentSeq.length === 0) return;
      savedPatterns.push(currentSeq.slice());
      updateExport();
    };

    document.getElementById('copyBtn').onclick = () => {
      exportBox.select();
      navigator.clipboard.writeText(exportBox.value);
    };

    document.getElementById('playBtn').onclick = () => {
      if (playTimer) {
        clearInterval(playTimer);
        playTimer = null;
        document.getElementById('playBtn').textContent = 'Play Sequence';
        renderBoard();
        return;
      }
      if (currentSeq.length === 0) return;
      const bpm = Math.max(60, Math.min(600, Number(document.getElementById('bpmInput').value) || 220));
      const intervalMs = (60 / bpm) * 1000;
      let step = 0;
      document.getElementById('playBtn').textContent = 'Stop';
      function tick() {
        if (step >= currentSeq.length) {
          clearInterval(playTimer);
          playTimer = null;
          document.getElementById('playBtn').textContent = 'Play Sequence';
          renderBoard();
          return;
        }
        const curr = currentSeq[step];
        const next = step + 1 < currentSeq.length ? currentSeq[step + 1] : null;
        renderBoard(curr);
        playStepSound(curr, next);
        step++;
      }
      tick();
      playTimer = setInterval(tick, intervalMs);
    };

    renderBoard();
    updateExport();
  </script>
</body>
</html>
